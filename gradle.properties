# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
# Keep compiler work in the Gradle process so builds do not leave a Kotlin
# daemon resident after the command exits.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.experimental.tryNext=false

# Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Do not keep a Gradle daemon (and its JVM heap) alive between builds.
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Configure all projects for reliable aggregate verification. Configuration
# on demand can skip Kotlin Multiplatform target setup when the root `test`
# lifecycle task depends on lazily-created Desktop test tasks.
org.gradle.configureondemand=false

# Android
android.useAndroidX=true

# Compose
org.jetbrains.compose.experimental.jscanvas.enabled=false

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true

# Testing
kotlin.test.default.jvm.target=17

# Security - Dependency Verification
systemProp.org.gradle.dependency.verification.console=verbose

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
