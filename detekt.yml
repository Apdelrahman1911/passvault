# Project overrides for Detekt 2.
#
# `buildUponDefaultConfig` is enabled in build.gradle.kts, so the tool's
# version-matched defaults remain authoritative. Keep this file deliberately
# small: the previous copied Detekt 1 configuration contained renamed and
# removed rules and prevented analysis from running at all.

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  # Private helpers are the preferred way to decompose state owners and UI
  # coordinators. Keep the strict 11-function limit on their public API while
  # allowing cohesive private implementation steps to remain named and small.
  TooManyFunctions:
    ignorePrivate: true

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - Composable
    excludes:
      - '**/src/*Test/**'

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  WildcardImport:
    excludeImports:
      - 'com.passvault.core.designsystem.generated.resources.*'
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: false
    excludeImportStatements: true
    excludePackageStatements: true
    excludeRawStrings: true
