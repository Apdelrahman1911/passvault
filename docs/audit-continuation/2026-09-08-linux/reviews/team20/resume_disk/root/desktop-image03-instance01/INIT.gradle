            rows.sum { it.finalizers.size() } != 1) reject('exact Room1-5/zero-new-schema finalizer contract')
    def linkPolicy = ADMITTED.linkPolicy
    if (linkPolicy.keySet() != (LINK_POLICY.keySet() + ['regularFileDevice']).toSet() ||
            linkPolicy.findAll { key, ignored -> key != 'regularFileDevice' } != LINK_POLICY ||
            !(linkPolicy.regularFileDevice instanceof Integer || linkPolicy.regularFileDevice instanceof Long) ||
            linkPolicy.regularFileDevice < 0) reject('UNBOUND original regular-file device/link policy')
    def layout = ADMITTED.imageLayout
    if (layout.keySet() != ['resourceSync', 'jlink', 'jpackage', 'imageRoot', 'resourceRoot',
            'producerRoots', 'opaqueActionInputsAndWritesReviewed'].toSet() ||
            layout.resourceSync != ':app-desktop:prepareDesktopAppResources' || layout.jlink != ':app-desktop:createRuntimeImage' ||
            layout.jpackage != PRODUCER || layout.imageRoot != checkoutPath.resolve('app-desktop/build/compose/binaries/main-release/app').toString() ||
            layout.resourceRoot != checkoutPath.resolve('app-desktop/build/generated/desktopAppResources').toString() ||
            layout.opaqueActionInputsAndWritesReviewed != true || !(layout.producerRoots instanceof Map) ||
            layout.producerRoots.keySet() != [layout.jlink, PRODUCER].toSet()) {
        reject('UNBOUND source image/precise producer roots/opaque action review')
    }
    def appBuild = checkoutPath.resolve('app-desktop/build')
    layout.producerRoots.each { task, roots ->
        if (!(roots instanceof Map) || roots.keySet() != ['outputRoot', 'workingRoot', 'argumentFile'].toSet()) reject('producer root schema')
        def name = task.substring(task.lastIndexOf(':') + 1)
        def working = appBuild.resolve('compose/tmp').resolve(name)
        if (absolutePath(roots.workingRoot) != working ||
                absolutePath(roots.argumentFile) != working.resolveSibling(name + '.args.txt')) reject('source-derived Compose local-state/argument binding')
        boundedPaths([roots.outputRoot, roots.workingRoot], 2).each { p ->
            if (!p.startsWith(appBuild) || p == appBuild) reject('precise producer root outside owned app build')
            noLinkAncestors(p)
            imageLinkRoots.add(p)
        }
    }
    // Known private/protected LocalState providers are derived from retained
    // constructor source, never called through reflection/protected getters.
    // These are ordinary no-link trees, not extra allowed-link domains.
    imageAuxiliaryRoots = ['resources', 'skiko'].collect { appBuild.resolve('compose/tmp').resolve(it) } +
            [absolutePath(layout.resourceRoot)] +
            ['createRuntimeImage', 'createReleaseDistributable'].collect { appBuild.resolve('compose/logs').resolve(it) }
    imageForbiddenRoots = ['sign', 'propertyFiles'].collect { appBuild.resolve('compose/tmp').resolve(it) }
    def allImageIoRoots = imageLinkRoots + imageAuxiliaryRoots
    if (layout.producerRoots[ADMITTED.imageLayout.jlink].outputRoot != checkoutPath.resolve(RUNTIME_OUTPUT_RELATIVE).toString() ||
            layout.producerRoots[PRODUCER].outputRoot != layout.imageRoot || allImageIoRoots.size() > 16 ||
            allImageIoRoots.toSet().size() != allImageIoRoots.size() || allImageIoRoots.any { a ->
                allImageIoRoots.any { b -> a != b && a.startsWith(b) } }) reject('image root domains overlap/change')
    declaredFileVisits = 0
    imageLinkCheck()
    boundRuntimeProperties = runtimePropertiesRelation()
    if (runtimePropertiesPhase != 'UNBOUND' ||
            !Files.notExists(boundRuntimeProperties, LinkOption.NOFOLLOW_LINKS)) {
        reject('runtime-properties output must be absent in the accepted fresh graph')
    }
    runtimePropertiesPhase = 'ABSENT_AT_GRAPH'
    tasks.each { taskIoCheck(it) }  // Every declared producer before ANY action.
    graphAccepted = true
    imageArmed = true
}
