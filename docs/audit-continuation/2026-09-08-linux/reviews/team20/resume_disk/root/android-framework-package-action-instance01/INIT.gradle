            if (!(values instanceof Collection) || values.size() > 128 || (edgeRefs += values.size()) > 8192) reject('edge bound')
            def names = values.collect { taskPath(it.path) }
            if (names.toSet().size() != names.size()) reject('duplicate edge')
            names.sort()
        }
        def rows = tasks.collect { task ->
            [path: taskPath(task.path), type: typeName(task.class.name), enabled: task.enabled,
             isTest: task instanceof Test, isExec: task instanceof Exec, isJavaExec: task instanceof JavaExec,
             isArchive: task instanceof AbstractArchiveTask, dependencies: edge(graph.getDependencies(task)),
             finalizers: edge(task.finalizedBy.getDependencies(task)), mustRunAfter: edge(task.mustRunAfter.getDependencies(task)),
             shouldRunAfter: edge(task.shouldRunAfter.getDependencies(task))]
        }
        if (rows.any { it != expectedByPath[it.path] || !it.enabled || it.isTest || it.isExec || it.isJavaExec }) {
            reject('actual graph type/edge/enablement differs; no task exclusion or expansion')
        }
        tasksByPath = tasks.collectEntries { [(it.path): it] }
        actualByPath = rows.collectEntries { [(it.path): it] }
        if (frameworkBinding == null || frameworkBinding.artifact != 'PROJECT/CLASSES' ||
            frameworkBinding.variantName != 'debug' || frameworkBinding.target != TARGET) reject('framework binding absent')
        // BEFORE all Gradle input fingerprinting: reject foreign keys/serialized configurations.
        signingGate = new PassVaultPrivateDebugSigningGate(runtime, tasksByPath[SIGNING], tasksByPath[PACKAGE])
        signingGate.bindGraph()
        tasks.each { task ->
            outputs[task.path] = outputPaths(task)
            outputRows.add([task: task.path, outputs: outputs[task.path].collect { it.toString() }])
        }
        def legal = tasksByPath[LEGAL]
        legalInputs(legal)
        if (checked(legal.outputDirectory.get().asFile, true) != checkout.resolve('app-android/build/generated/assets/prepareAndroidLegalAssets') ||
            !members(outputs[LEGAL], true, true).empty) reject('fresh exact legal Sync output required')
        verifierBinding(tasksByPath[PACKAGE_TARGET])
        compileGate = new PassVaultFrameworkCompileGate(tasksByPath[COMPILER], tasksByPath[TARGET],
            checkout.resolve(FRAMEWORK_FIXTURE), FRAMEWORK_FIXTURE_SHA, checked, emit)
        compileGate.bindGraph()
        schemaEqual('before-actions')
        expectedPaths = paths
        emit([kind: 'action-admission', tasks: rows, outputRoots: outputRows,
            expectedGraphSha256: EXPECTED_GRAPH_SHA, taskCount: tasks.size(), edgeReferences: edgeRefs,
            signing: 'NEW_PRIVATE_DEFAULT_DEBUG_KEY_ONLY_NO_SECRET_VALUES',
            qualification: 'Fresh finite graph/source/output/signing guards; cooperative plugin contract, not adversarial sandbox.'])
        control.actionsAdmitted = true
        control.gate = true
    } catch (Throwable failure) { control.gate = false; control.failed = true; throw failure }
}
beforeAction = { task ->
    if (!expectedPaths.contains(task.path) || entered.contains(task.path) ||
        !task.enabled || task.class.name != actualByPath[task.path].type || outputPaths(task) != outputs[task.path]) {
        reject('task/declared output changed')
    }
    entered.add(task.path)
    if (task.path == ROOM) schemaEqual('before-schema-finalizer')
    if (task.path == LEGAL) {
        legalInputs(task)
        if (!members(outputs[LEGAL], true, true).empty) reject('legal Sync output no longer fresh')
    }
    if (task.path == SIGNING) signingGate.beforeValidation()
    if (task.path == PACKAGE) signingGate.beforePackage()
    if (task.path == COMPILER) compileGate.beforeCompiler()
    if (task.path == TARGET) compileGate.beforeCarrier()
    if (task.path == PACKAGE_TARGET) packageInput = hashed(apkFile(task))
}
afterAction = { task, state ->
    if (!entered.contains(task.path) || completedTasks.contains(task.path)) reject('unexpected/repeated outcome')
    completedTasks.add(task.path)
    emit([kind: 'task-state', task: task.path, executed: state.executed, skipped: state.skipped,
        upToDate: state.upToDate, noSource: state.noSource, didWork: state.didWork,
        skipMessage: state.skipMessage, failureType: state.failure?.class?.name])
    if (state.failure != null) return
    if (task.path == SIGNING) signingGate.afterValidation(state)
    if (task.path == COMPILER) compileGate.afterCompiler(state)
    if (task.path == ROOM) {
        boolean action = state.executed && !state.skipped && !state.upToDate && !state.noSource && state.skipMessage == null
        boolean unchanged = state.executed && state.skipped && !state.upToDate && state.noSource && !state.didWork && state.skipMessage == 'NO-SOURCE'
        if (!action && !unchanged) reject('Room requires real action or unchanged NO-SOURCE')
        schemaEqual('after-schema-finalizer')
        schemaCompleted = true
    }
    if (task.path == PACKAGE_TARGET) {
        if (!state.executed || state.skipped || state.upToDate || state.noSource || state.skipMessage != null) reject('fresh package verifier action required')
        packageEvidence(task)
        packageVerified = true
    }
}
