class PassVaultPrivateDebugSigningGate {
    private final Path home
    private final Path key
    private final Object validation
    private final Object packaging
    private Object validationProvider
    private Object packageProvider
    private boolean bound = false
    private boolean validationEntered = false
    private boolean validationCompleted = false
    private Object createdKeyIdentity

    PassVaultPrivateDebugSigningGate(Path runtime, Object validation, Object packaging) {
        this.home = runtime.resolve('home')
        this.key = home.resolve('.android/debug.keystore')
        this.validation = validation
        this.packaging = packaging
    }

    private static void require(boolean ok, String why) {
        if (!ok) throw new org.gradle.api.GradleException('PrivateDebugSigning: ' + why)
    }

    private void exactKey(Object value) {
        require(value instanceof File, 'missing file value')
        Path path = ((File) value).toPath()
        // Never canonicalize or follow a foreign path before rejecting it.
        require(path.isAbsolute() && path == path.normalize() && path == key, 'unexpected key path')
    }

    private void parents() {
        // Original outer custody already binds runtime/home ancestors; this rejects later link substitutions.
        [home, home.resolve('.android')].each { Path path ->
            if (Files.exists(path, LinkOption.NOFOLLOW_LINKS)) {
                def attrs = Files.readAttributes(path, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
                require(attrs.isDirectory() && !attrs.isSymbolicLink(), 'unexpected key parent')
            } else {
                require(path != home && Files.notExists(path, LinkOption.NOFOLLOW_LINKS), 'unknown key parent')
            }
        }
    }

    private void absentKey() {
        parents()
        require(Files.notExists(key, LinkOption.NOFOLLOW_LINKS), 'key not proven absent')
    }

    private void provider(Object value) {
        require(value != null, 'missing signing provider')
        // resolve() prioritizes an alternate serialized config over storeFile. Do not invoke it here.
        require(value.getSigningConfigFileCollection().isEmpty(), 'alternate signing config forbidden')
        exactKey(value.getStoreFile().getOrNull())
        // Fixed public defaults for a NEW disposable key only; never print actual values.
        require(value.getName().getOrNull() == 'debug', 'not ordinary Debug')
        require(value.getKeyAlias().getOrNull() == 'AndroidDebugKey', 'nondefault alias')
        require(value.getStorePassword().getOrNull() == 'android', 'nondefault store password')
        require(value.getKeyPassword().getOrNull() == 'android', 'nondefault key password')
        require(value.getStoreType().getOrNull() == KeyStore.getDefaultType(), 'nondefault store type')
    }

    private void consumers() {
        Object currentValidation = validation.getSigningConfig().getOrNull()
        Object currentPackage = packaging.'getSigningConfigData$gradle_core'()
        require(currentValidation != null && currentPackage != null, 'missing actual consumer')
        if (bound) {
            require(currentValidation.is(validationProvider) && currentPackage.is(packageProvider),
                'signing consumer replaced')
        }
        provider(currentValidation)
        provider(currentPackage)
        exactKey(validation.getDefaultDebugKeystoreLocation().getOrNull())
        // Paths only. Caller must invoke this before Gradle can fingerprint these file inputs.
        def inputs = packaging.getSigningKeystoreFile().getFiles()
        require(inputs.size() == 1, 'unexpected package key inputs')
        exactKey(inputs.iterator().next())
        validationProvider = currentValidation
        packageProvider = currentPackage
    }

    void bindGraph() {
        require(!bound && !validationEntered, 'duplicate graph binding')
        require(System.getenv('HOME') == home.toString() && System.getProperty('user.home') == home.toString(),
            'private home mismatch')
        absentKey()
        consumers()
        bound = true
    }

    void beforeValidation() {
        require(bound && !validationEntered && !validationCompleted, 'validation order')
        consumers()
        absentKey()
        validationEntered = true
    }

    void afterValidation(Object taskState) {
        require(bound && validationEntered && !validationCompleted, 'validation completion order')
        require(taskState.failure == null && !taskState.skipped && !taskState.upToDate && !taskState.noSource,
            'fresh validation action not established')
        consumers()
        parents()
        def attrs = Files.readAttributes(key, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
        require(attrs.isRegularFile() && !attrs.isSymbolicLink() && attrs.size() > 0 && attrs.size() <= 65536,
            'invalid newly created key file')
        createdKeyIdentity = [attrs.fileKey(), attrs.size(), attrs.lastModifiedTime()]
        require(createdKeyIdentity[0] != null, 'key identity unavailable')
        validationCompleted = true
    }

    void beforePackage() {
        require(bound && validationCompleted, 'package before validated key')
        consumers()
        parents()
        def attrs = Files.readAttributes(key, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
        require(attrs.isRegularFile() && !attrs.isSymbolicLink() &&
            [attrs.fileKey(), attrs.size(), attrs.lastModifiedTime()] == createdKeyIdentity,
            'generated key changed')
    }
}
