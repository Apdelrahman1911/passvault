class PassVaultFrameworkCompileGate {
    private final Object compiler
    private final Object carrier
    private final Path fixture
    private final String expectedFixtureSha
    private final Closure checked
    private final Closure emit
    private final String classEntry = 'com/passvault/android/audit/AndroidClipboardLocaleInstrumentationTest.class'
    private boolean entered = false
    private boolean compiled = false
    private boolean observed = false
    private List<Path> roots

    PassVaultFrameworkCompileGate(Object compiler, Object carrier, Path fixture,
            String expectedFixtureSha, Closure checked, Closure emit) {
        this.compiler = compiler
        this.carrier = carrier
        this.fixture = fixture
        this.expectedFixtureSha = expectedFixtureSha
        this.checked = checked
        this.emit = emit
    }

    private static void require(boolean ok, String why) {
        if (!ok) throw new org.gradle.api.GradleException('FrameworkCompileGate: ' + why)
    }

    private Map image(Path path) {
        checked.call(path.toFile(), true)
        require(Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS), 'required regular file missing')
        def before = Files.readAttributes(path, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
        long size = before.size()
        require(size > 0 && size <= 2 * 1024 * 1024, 'source/class size bound')
        byte[] bytes = Files.readAllBytes(path)
        def after = Files.readAttributes(path, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
        require(bytes.length == size && after.size() == size && after.fileKey() == before.fileKey() &&
            after.lastModifiedTime() == before.lastModifiedTime(), 'source/class identity drift')
        [bytes: bytes.length, sha256: MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString(),
         header: bytes.take(Math.min(8, bytes.length)).collect { String.format('%02x', it & 255) }.join()]
    }

    private List<Path> classRoots() {
        def jars = carrier.getClassJars().get()
        def dirs = carrier.getClassDirectories().get()
        require(jars.size() + dirs.size() <= 32, 'PROJECT/CLASSES root bound')
        def all = (jars + dirs).collect { checked.call(it.asFile, true) }
        require(!all.empty && all.toSet().size() == all.size(), 'missing/duplicate class roots')
        all.sort { it.toString() }
    }

    void bindGraph() {
        require(roots == null && !entered, 'duplicate binding')
        require(compiler.path == ':app-android:compileDebugAndroidTestKotlin' &&
            compiler.class.name == 'org.jetbrains.kotlin.gradle.tasks.KotlinCompile_Decorated', 'compiler identity')
        require(carrier.path == ':app-android:auditCompileDebugFrameworkInstrumentation' &&
            carrier.class.name == 'PassVaultFrameworkClassCarrier_Decorated', 'carrier identity')
        roots = classRoots()
        // Fresh checkout: no prior bytecode may be mistaken for this compiler's output.
        roots.each { p -> require(Files.notExists(p, LinkOption.NOFOLLOW_LINKS), 'class root already exists') }
    }

    void beforeCompiler() {
        require(roots != null && !entered && !compiled && classRoots() == roots, 'compiler entry/binding order')
        // Public pinned KGP2.4.10 API. AbstractKotlinCompile.executeImpl obtains this exact file tree.
        def sources = compiler.getSources().getAsFileTree().getFiles()
        require(sources.size() > 0 && sources.size() <= 4096, 'compiler source bound')
        def names = sources.collect { checked.call(it, false) }
        require(names.count { it == fixture } == 1, 'fixture missing from actual compiler source tree')
        Map source = image(fixture)
        require(source.sha256 == expectedFixtureSha, 'fixture input changed')
        entered = true
        emit.call([kind: 'framework-compiler-input', task: compiler.path,
            fixture: fixture.toString(), image: source, sourceCount: names.size(),
            qualification: 'Actual public compiler source-file input; not runtime execution.'])
    }

    void afterCompiler(Object state) {
        require(entered && !compiled, 'compiler completion order')
        require(state.failure == null && state.executed && !state.skipped && !state.upToDate &&
            !state.noSource && state.skipMessage == null && state.didWork, 'fresh compiler success required')
        require(image(fixture).sha256 == expectedFixtureSha, 'fixture changed during compilation')
        compiled = true
    }

    void beforeCarrier() {
        require(compiled && !observed && classRoots() == roots, 'carrier before compiler or changed roots')
        def found = []
        roots.each { p ->
            checked.call(p.toFile(), true)
            if (Files.isDirectory(p, LinkOption.NOFOLLOW_LINKS)) {
                Path candidate = p.resolve(classEntry)
                if (Files.exists(candidate, LinkOption.NOFOLLOW_LINKS)) {
                    found.add([container: p.toString(), entry: classEntry, image: image(candidate)])
                }
            } else if (Files.isRegularFile(p, LinkOption.NOFOLLOW_LINKS)) {
                require(Files.size(p) <= 32 * 1024 * 1024, 'class jar bound')
                new ZipFile(p.toFile()).withCloseable { zip ->
                    require(zip.size() <= 8192, 'class jar entry count bound')
                    def entries = zip.entries().toList().findAll { it.name == classEntry }
                    require(entries.size() <= 1, 'duplicate expected class entry')
                    if (!entries.empty) {
                        def entry = entries[0]
                        require(!entry.directory && entry.size > 0 && entry.size <= 2 * 1024 * 1024,
                            'expected class entry size/type')
                        byte[] bytes
                        zip.getInputStream(entry).withCloseable { input -> bytes = input.readNBytes(2 * 1024 * 1024 + 1) }
                        require(bytes.length == entry.size, 'class decompression bound/size mismatch')
                        found.add([container: p.toString(), entry: classEntry,
                            image: [bytes: bytes.length,
                                sha256: MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString(),
                                header: bytes.take(Math.min(8, bytes.length)).collect {
                                    String.format('%02x', it & 255)
                                }.join()]])
                    }
                }
            } else require(Files.notExists(p, LinkOption.NOFOLLOW_LINKS), 'unknown PROJECT/CLASSES root')
        }
        require(found.size() == 1 && found[0].image.header.startsWith('cafebabe'),
            'one fresh expected instrumentation class required')
        observed = true
        emit.call([kind: 'framework-compiled-class', task: compiler.path, artifact: 'PROJECT/CLASSES',
            files: found, observedTestCases: 0,
            qualification: 'Fresh successful compiler and emitted instrumentation class, NOT Android runtime or ordinary APK class inclusion.'])
    }

    boolean complete() { compiled && observed }
}
