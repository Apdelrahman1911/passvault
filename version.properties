# PassVault Version Configuration
# This file is used by Gradle to determine the app version

# Version Code - must be incremented for each release
# Major * 1000000 + Minor * 1000 + Patch
VERSION_CODE=1000001

# Version Name - user-facing version
VERSION_MAJOR=1
VERSION_MINOR=0
VERSION_PATCH=1
VERSION_NAME=1.0.1

# Build metadata
BUILD_TIMESTAMP=2026-07-29T00:00:00Z
BUILD_NUMBER=2

# Release channel: ALPHA, BETA, RC, RELEASE. The repository is not yet a
# signed, independently reviewed production release.
RELEASE_CHANNEL=ALPHA

# Minimum supported version (for migration purposes)
MIN_SUPPORTED_VERSION=1000000
