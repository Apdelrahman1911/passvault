# PassVault Version Configuration
# This file is used by Gradle to determine the app version

# Store build number. Increment this for every Google Play or App Store upload;
# it is intentionally independent from the user-facing semantic version.
VERSION_CODE=1000032

# Version Name - user-facing version
VERSION_MAJOR=1
VERSION_MINOR=0
VERSION_PATCH=3
VERSION_NAME=1.0.3

# Build metadata
BUILD_TIMESTAMP=2026-08-12T20:04:14Z
BUILD_NUMBER=5

# Release channel: ALPHA, BETA, RC, RELEASE. Version 1.0.3 is prepared for
# the protected testing-to-production promotion flow.
RELEASE_CHANNEL=RC

# Minimum supported version (for migration purposes)
MIN_SUPPORTED_VERSION=1000000
