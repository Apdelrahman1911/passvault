name: Mobile release preflight

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - both

permissions:
  contents: read

jobs:
  preflight:
    uses: Apdelrahman1911/mobile-release-kit/.github/workflows/reusable-preflight.yml@c3a5a0fedce2695f9e5ff520bc15c48aa0af268c
    with:
      tooling_sha: c3a5a0fedce2695f9e5ff520bc15c48aa0af268c
      source_sha: ${{ github.sha }}
      platform: ${{ inputs.platform }}
