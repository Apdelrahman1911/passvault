name: Mobile Store Release

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      channel:
        required: true
        type: string
      operation:
        required: true
        type: string
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      testflight_distribution:
        required: false
        default: email-list
        type: string
      production_confirmation:
        required: false
        default: ''
        type: string
      testing_confirmation:
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and upload
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      channel:
        description: Store destination
        required: true
        default: internal
        type: choice
        options:
          - internal
          - external
          - production
      operation:
        description: Upload a new internal binary or promote the exact existing build
        required: true
        default: upload
        type: choice
        options:
          - upload
          - promote
      version:
        description: Exact marketing version; blank uses version.properties
        required: false
        type: string
      build_number:
        description: Exact store build number; blank uses version.properties
        required: false
        type: string
      testflight_distribution:
        description: External iOS invitation method; public links do not import tester identities
        required: true
        default: public-link
        type: choice
        options:
          - public-link
          - email-list
      production_confirmation:
        description: Type I_APPROVE_PRODUCTION only for a production upload
        required: false
        type: string
      testing_confirmation:
        description: Type I_CONFIRM_REQUIRED_TESTING_COMPLETED only after required store testing is complete
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-store-${{ inputs.channel }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  RUBY_VERSION: '3.3'
  FASTLANE_OPT_OUT_USAGE: '1'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4096m'

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    env:
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      SECURITY_EMAIL: ${{ vars.SECURITY_EMAIL }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      SUPPORT_URL: ${{ vars.SUPPORT_URL }}
      PROJECT_URL: ${{ vars.PROJECT_URL }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      environment: ${{ steps.environment.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the correct protected branch and confirmations
        run: |
          expected_branch=testing
          if [[ "${{ inputs.channel }}" == "production" ]]; then expected_branch=release; fi
          if [[ "$GITHUB_REF" != "refs/heads/$expected_branch" ]]; then
            echo "${{ inputs.channel }} must run from $expected_branch." >&2
            exit 1
          fi
          if [[ "${{ inputs.operation }}" == "upload" && "${{ inputs.channel }}" != "internal" ]]; then
            echo "New binaries may only be uploaded to internal testing." >&2
            exit 1
          fi
          if [[ "${{ inputs.operation }}" == "promote" && "${{ inputs.channel }}" == "internal" ]]; then
            echo "Internal testing requires an upload operation." >&2
            exit 1
          fi
          if [[ "${{ inputs.channel }}" == "production" &&
                "${{ inputs.production_confirmation }}" != "I_APPROVE_PRODUCTION" ]]; then
            echo "Production requires the exact confirmation I_APPROVE_PRODUCTION." >&2
            exit 1
          fi
          if [[ "${{ inputs.channel }}" == "production" &&
                "${{ inputs.testing_confirmation }}" != "I_CONFIRM_REQUIRED_TESTING_COMPLETED" ]]; then
            echo "Production requires confirmation that all required store testing is complete." >&2
            exit 1
          fi

      - name: Validate version and public release metadata
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_CODE="${{ inputs.build_number }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' version.properties)"
          fi
          if [[ -z "$VERSION_CODE" ]]; then
            VERSION_CODE="$(awk -F= '$1 == "VERSION_CODE" { print $2 }' version.properties)"
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ || "$VERSION_CODE" -lt 1000000 ]]; then
            echo "The build number must be an integer of at least 1000000." >&2
            exit 1
          fi
          ./scripts/validate-release-metadata.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Select protected environment
        id: environment
        run: |
          case "${{ inputs.channel }}" in
            internal) environment=mobile-beta ;;
            external) environment=mobile-external-beta ;;
            production) environment=mobile-production ;;
            *) exit 1 ;;
          esac
          echo "name=$environment" >> "$GITHUB_OUTPUT"

      - name: Validate repository release automation
        run: ./scripts/test-release-automation.sh

      - name: Require production store assets
        if: inputs.channel == 'production'
        run: ./scripts/validate-mobile-store-assets.rb

  android:
    name: Android ${{ inputs.channel }}
    if: inputs.operation == 'upload' && (inputs.platform == 'both' || inputs.platform == 'android')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Initialize private runtime path
        run: echo "PRIVATE_RUNTIME=$RUNNER_TEMP/passvault-release" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Create private runtime inputs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_METADATA_ARCHIVE_BASE64: ${{ secrets.STORE_METADATA_ARCHIVE_BASE64 }}
          PLAY_CLOSED_TESTERS_BASE64: ${{ secrets.PLAY_CLOSED_TESTERS_BASE64 }}
          COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: |
          install -d -m 700 "$PRIVATE_RUNTIME/store-input" "$PRIVATE_RUNTIME/store"
          printf '%s' "$KEYSTORE_BASE64" | openssl base64 -d -A > "$PRIVATE_RUNTIME/android-upload.jks"
          chmod 600 "$PRIVATE_RUNTIME/android-upload.jks"
          printf '%s' "$STORE_METADATA_ARCHIVE_BASE64" |
            openssl base64 -d -A | tar -xzf - -C "$PRIVATE_RUNTIME/store-input"
          if [[ "${{ inputs.channel }}" == "external" ]]; then
            printf '%s' "$PLAY_CLOSED_TESTERS_BASE64" |
              openssl base64 -d -A > "$PRIVATE_RUNTIME/play-testers.txt"
            chmod 600 "$PRIVATE_RUNTIME/play-testers.txt"
            ./scripts/validate-mobile-tester-files.sh play "$PRIVATE_RUNTIME/play-testers.txt"
          fi
          ./scripts/prepare-mobile-store-metadata.sh \
            "$PRIVATE_RUNTIME/store-input" "$PRIVATE_RUNTIME/store" "${{ needs.validate.outputs.version_code }}"
          echo "KEYSTORE_PATH=$PRIVATE_RUNTIME/android-upload.jks" >> "$GITHUB_ENV"
          echo "STORE_METADATA_ROOT=$PRIVATE_RUNTIME/store" >> "$GITHUB_ENV"

      - name: Validate Android signing input
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$KEYSTORE_PATH" -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed Android release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            :app-android:verifyReleaseSigningConfiguration \
            :app-android:assembleStandardRelease \
            :app-android:bundleStandardRelease \
            -Ppassvault.requireReleaseSigning=true \
            -Ppassvault.versionName=${{ needs.validate.outputs.version }} \
            -Ppassvault.versionCode=${{ needs.validate.outputs.version_code }}
          ./scripts/verify-android-signatures.sh
          echo "ANDROID_AAB_PATH=$GITHUB_WORKSPACE/app-android/build/outputs/bundle/standardRelease/app-android-standard-release.aab" >> "$GITHUB_ENV"
          mapping="$GITHUB_WORKSPACE/app-android/build/outputs/mapping/standardRelease/mapping.txt"
          if [[ -f "$mapping" ]]; then echo "ANDROID_MAPPING_PATH=$mapping" >> "$GITHUB_ENV"; fi

      - name: Authenticate to Google with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Upload to Google Play
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          PASSVAULT_PRODUCTION_APPROVED: ${{ inputs.production_confirmation }}
          PASSVAULT_REQUIRED_TESTING_CONFIRMED: ${{ inputs.testing_confirmation }}
          UPLOAD_STORE_ASSETS: ${{ inputs.channel == 'production' }}
        run: |
          case "${{ inputs.channel }}" in
            internal) bundle exec fastlane android internal ;;
            external) bundle exec fastlane android closed ;;
            production) bundle exec fastlane android production ;;
          esac

      - name: Remove private runtime inputs
        if: always()
        run: |
          if [[ -n "${PRIVATE_RUNTIME:-}" && -d "$PRIVATE_RUNTIME" ]]; then
            find "$PRIVATE_RUNTIME" -type f -exec chmod 600 {} + 2>/dev/null || true
            find "$PRIVATE_RUNTIME" -type f -exec rm -f -- {} + 2>/dev/null || true
            find "$PRIVATE_RUNTIME" -depth -type d -exec rmdir {} + 2>/dev/null || true
          fi

  ios:
    name: iOS ${{ inputs.channel }}
    if: inputs.operation == 'upload' && (inputs.platform == 'both' || inputs.platform == 'ios')
    needs: validate
    # Compose Multiplatform 1.11 links UIKit symbols introduced with the
    # Xcode 26 SDK. Keep the store archive on the matching hosted image.
    runs-on: macos-26
    environment: ${{ needs.validate.outputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Initialize private runtime paths
        run: |
          echo "PRIVATE_RUNTIME=$RUNNER_TEMP/passvault-release" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/passvault-release/release.keychain-db" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Require Xcode 26 or newer
        run: |
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          if [[ ! "$XCODE_MAJOR" =~ ^[0-9]+$ || "$XCODE_MAJOR" -lt 26 ]]; then
            echo "PassVault iOS release builds require Xcode 26 or newer; found $XCODE_VERSION." >&2
            exit 1
          fi
          echo "Xcode release toolchain: $XCODE_VERSION"

      - name: Validate Fastlane runtime
        run: bundle exec fastlane --version

      - name: Create private runtime inputs and signing keychain
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          STORE_METADATA_ARCHIVE_BASE64: ${{ secrets.STORE_METADATA_ARCHIVE_BASE64 }}
          TESTERS_BASE64: ${{ secrets.TESTFLIGHT_EXTERNAL_TESTERS_CSV_BASE64 }}
          COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: |
          install -d -m 700 "$PRIVATE_RUNTIME/store-input" "$PRIVATE_RUNTIME/store" "$PRIVATE_RUNTIME/export"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | openssl base64 -d -A > "$PRIVATE_RUNTIME/distribution.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | openssl base64 -d -A > "$PRIVATE_RUNTIME/profile.mobileprovision"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | openssl base64 -d -A > "$PRIVATE_RUNTIME/app-store-connect-key.p8"
          printf '%s' "$STORE_METADATA_ARCHIVE_BASE64" |
            openssl base64 -d -A | tar -xzf - -C "$PRIVATE_RUNTIME/store-input"
          chmod 600 "$PRIVATE_RUNTIME/distribution.p12" "$PRIVATE_RUNTIME/profile.mobileprovision" \
            "$PRIVATE_RUNTIME/app-store-connect-key.p8"

          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$PRIVATE_RUNTIME/distribution.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          CODESIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | \
            awk '$2 ~ /^[0-9A-Fa-f]{40}$/ { print toupper($2); exit }')"
          if [[ ! "$CODESIGN_IDENTITY" =~ ^[0-9A-F]{40}$ ]]; then
            echo "The imported Apple Distribution identity is unavailable." >&2
            exit 1
          fi

          security cms -D -i "$PRIVATE_RUNTIME/profile.mobileprovision" > "$PRIVATE_RUNTIME/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PRIVATE_RUNTIME/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PRIVATE_RUNTIME/profile.plist")"
          install -d "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PRIVATE_RUNTIME/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          if [[ "${{ inputs.channel }}" == "external" &&
                "${{ inputs.testflight_distribution }}" == "email-list" ]]; then
            printf '%s' "$TESTERS_BASE64" | openssl base64 -d -A > "$PRIVATE_RUNTIME/testflight-testers.csv"
            chmod 600 "$PRIVATE_RUNTIME/testflight-testers.csv"
            ./scripts/validate-mobile-tester-files.sh \
              testflight "$PRIVATE_RUNTIME/testflight-testers.csv"
          fi
          ./scripts/prepare-mobile-store-metadata.sh \
            "$PRIVATE_RUNTIME/store-input" "$PRIVATE_RUNTIME/store" "${{ needs.validate.outputs.version_code }}"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "STORE_METADATA_ROOT=$PRIVATE_RUNTIME/store" >> "$GITHUB_ENV"
          if [[ -f "$PRIVATE_RUNTIME/testflight-testers.csv" ]]; then
            echo "TESTFLIGHT_EXTERNAL_TESTERS_FILE=$PRIVATE_RUNTIME/testflight-testers.csv" >> "$GITHUB_ENV"
          fi

      - name: Enforce App Store France availability constraint
        env:
          PASSVAULT_ASC_CONFIGURATION_SOURCE: environment
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          EXPORT_COMPLIANCE_STATUS: ${{ vars.EXPORT_COMPLIANCE_STATUS }}
          IOS_FRANCE_AVAILABLE: ${{ vars.IOS_FRANCE_AVAILABLE }}
        run: |
          export ASC_PRIVATE_KEY_FILE="$PRIVATE_RUNTIME/app-store-connect-key.p8"
          ruby scripts/validate-app-store-connect.rb

      - name: Archive and export signed IPA
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          EXPORT_COMPLIANCE_STATUS: ${{ vars.EXPORT_COMPLIANCE_STATUS }}
          IOS_FRANCE_AVAILABLE: ${{ vars.IOS_FRANCE_AVAILABLE }}
        run: |
          ./scripts/validate-ios-export-compliance.sh
          case "$EXPORT_COMPLIANCE_STATUS" in
            EXEMPT_APPROVED) ENCRYPTION_FLAG=NO ;;
            NON_EXEMPT_APPROVED) ENCRYPTION_FLAG=YES ;;
            *) echo "Approved export compliance is required." >&2; exit 1 ;;
          esac
          ARCHIVE_PATH="$PRIVATE_RUNTIME/PassVault.xcarchive"
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme PassVault \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            TEAM_ID="$TEAM_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="${{ needs.validate.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ needs.validate.outputs.version_code }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODESIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption="$ENCRYPTION_FLAG" \
            LD_GENERATE_MAP_FILE=YES \
            LD_MAP_FILE_PATH="$PRIVATE_RUNTIME/PassVault-LinkMap.txt"

          APP_PLIST="$ARCHIVE_PATH/Products/Applications/PassVault.app/Info.plist"
          ./scripts/validate-ios-export-compliance.sh "$APP_PLIST"

          /usr/bin/plutil -create xml1 "$PRIVATE_RUNTIME/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$PRIVATE_RUNTIME/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$PRIVATE_RUNTIME/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$PRIVATE_RUNTIME/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$PRIVATE_RUNTIME/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$PRIVATE_RUNTIME/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$PRIVATE_RUNTIME/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" \
            "$PRIVATE_RUNTIME/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$PRIVATE_RUNTIME/export" \
            -exportOptionsPlist "$PRIVATE_RUNTIME/ExportOptions.plist"
          IPA_PATH="$(find "$PRIVATE_RUNTIME/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          ./scripts/verify-ios-exported-artifact.sh \
            "$ARCHIVE_PATH" "$IPA_PATH" "$TEAM_ID" "$BUNDLE_ID" "$PROFILE_UUID" \
            "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.version_code }}" \
            "$PRIVATE_RUNTIME/PassVault-LinkMap.txt"
          echo "IOS_IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APP_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.version_code }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          EXPORT_COMPLIANCE_STATUS: ${{ vars.EXPORT_COMPLIANCE_STATUS }}
          IOS_FRANCE_AVAILABLE: ${{ vars.IOS_FRANCE_AVAILABLE }}
          TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
          TESTFLIGHT_DISTRIBUTION_MODE: ${{ inputs.testflight_distribution }}
          TESTFLIGHT_NOTIFY_AFTER_APPROVAL: 'true'
          APP_REVIEW_CONTACT_NAME: ${{ vars.APP_REVIEW_CONTACT_NAME }}
          APP_REVIEW_EMAIL: ${{ vars.APP_REVIEW_EMAIL }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          PASSVAULT_PRODUCTION_APPROVED: ${{ inputs.production_confirmation }}
          PASSVAULT_REQUIRED_TESTING_CONFIRMED: ${{ inputs.testing_confirmation }}
        run: |
          case "${{ inputs.channel }}" in
            internal) bundle exec fastlane ios internal ;;
            external) bundle exec fastlane ios external ;;
            production) bundle exec fastlane ios production_candidate ;;
          esac

      - name: Remove private runtime inputs and keychain
        if: always()
        run: |
          profile_uuid="${PROFILE_UUID:-}"
          if [[ -z "$profile_uuid" && -f "$PRIVATE_RUNTIME/profile.plist" ]]; then
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PRIVATE_RUNTIME/profile.plist" 2>/dev/null || true)"
          fi
          if [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
            test ! -f "$profile" || rm -f -- "$profile"
          fi
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          if [[ -n "${PRIVATE_RUNTIME:-}" && -d "$PRIVATE_RUNTIME" ]]; then
            find "$PRIVATE_RUNTIME" -type f -exec chmod 600 {} + 2>/dev/null || true
            find "$PRIVATE_RUNTIME" -type f -exec rm -f -- {} + 2>/dev/null || true
            find "$PRIVATE_RUNTIME" -depth -type d -exec rmdir {} + 2>/dev/null || true
          fi

  promote-android:
    name: Promote Android ${{ inputs.channel }}
    if: inputs.operation == 'promote' && (inputs.platform == 'both' || inputs.platform == 'android')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Validate configured Play closed testers
        if: inputs.channel == 'external'
        env:
          PLAY_CLOSED_TESTERS_BASE64: ${{ secrets.PLAY_CLOSED_TESTERS_BASE64 }}
        run: |
          testers="$RUNNER_TEMP/play-closed-testers.txt"
          printf '%s' "$PLAY_CLOSED_TESTERS_BASE64" | openssl base64 -d -A > "$testers"
          chmod 600 "$testers"
          ./scripts/validate-mobile-tester-files.sh play "$testers"
          rm -f "$testers"

      - name: Prepare production metadata and screenshots
        if: inputs.channel == 'production'
        env:
          STORE_METADATA_ARCHIVE_BASE64: ${{ secrets.STORE_METADATA_ARCHIVE_BASE64 }}
          COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: |
          PRIVATE_RUNTIME="$RUNNER_TEMP/passvault-play-promotion"
          install -d -m 700 "$PRIVATE_RUNTIME/input" "$PRIVATE_RUNTIME/store"
          printf '%s' "$STORE_METADATA_ARCHIVE_BASE64" |
            openssl base64 -d -A | tar -xzf - -C "$PRIVATE_RUNTIME/input"
          ./scripts/prepare-mobile-store-metadata.sh \
            "$PRIVATE_RUNTIME/input" "$PRIVATE_RUNTIME/store" \
            "${{ needs.validate.outputs.version_code }}"
          echo "STORE_METADATA_ROOT=$PRIVATE_RUNTIME/store" >> "$GITHUB_ENV"

      - name: Authenticate to Google with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Promote exact Google Play build
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          BUILD_NUMBER: ${{ needs.validate.outputs.version_code }}
          PASSVAULT_PRODUCTION_APPROVED: ${{ inputs.production_confirmation }}
          PASSVAULT_REQUIRED_TESTING_CONFIRMED: ${{ inputs.testing_confirmation }}
          UPLOAD_STORE_ASSETS: ${{ inputs.channel == 'production' }}
        run: |
          if [[ "${{ inputs.channel }}" == "external" ]]; then
            bundle exec fastlane android promote_external
          else
            bundle exec fastlane android promote_production
          fi

      - name: Remove promotion metadata
        if: always() && inputs.channel == 'production'
        run: |
          private_runtime="$RUNNER_TEMP/passvault-play-promotion"
          if [[ -d "$private_runtime" ]]; then
            find "$private_runtime" -type f -exec chmod 600 {} + 2>/dev/null || true
            find "$private_runtime" -type f -exec rm -f -- {} + 2>/dev/null || true
            find "$private_runtime" -depth -type d -exec rmdir {} + 2>/dev/null || true
          fi

  promote-ios:
    name: Promote iOS ${{ inputs.channel }}
    if: inputs.operation == 'promote' && (inputs.platform == 'both' || inputs.platform == 'ios')
    needs: validate
    runs-on: macos-26
    environment: ${{ needs.validate.outputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Validate configured TestFlight email testers
        if: inputs.channel == 'external'
        env:
          TESTERS_BASE64: ${{ secrets.TESTFLIGHT_EXTERNAL_TESTERS_CSV_BASE64 }}
        run: |
          testers="$RUNNER_TEMP/testflight-testers.csv"
          printf '%s' "$TESTERS_BASE64" | openssl base64 -d -A > "$testers"
          chmod 600 "$testers"
          ./scripts/validate-mobile-tester-files.sh testflight "$testers"
          echo "TESTFLIGHT_EXTERNAL_TESTERS_FILE=$testers" >> "$GITHUB_ENV"

      - name: Prepare production metadata
        if: inputs.channel == 'production'
        env:
          STORE_METADATA_ARCHIVE_BASE64: ${{ secrets.STORE_METADATA_ARCHIVE_BASE64 }}
          COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: |
          PRIVATE_RUNTIME="$RUNNER_TEMP/passvault-promotion"
          install -d -m 700 "$PRIVATE_RUNTIME/input" "$PRIVATE_RUNTIME/store"
          printf '%s' "$STORE_METADATA_ARCHIVE_BASE64" |
            openssl base64 -d -A | tar -xzf - -C "$PRIVATE_RUNTIME/input"
          ./scripts/prepare-mobile-store-metadata.sh \
            "$PRIVATE_RUNTIME/input" "$PRIVATE_RUNTIME/store" \
            "${{ needs.validate.outputs.version_code }}"
          echo "STORE_METADATA_ROOT=$PRIVATE_RUNTIME/store" >> "$GITHUB_ENV"

      - name: Promote exact App Store Connect build
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APP_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.version_code }}
          TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
          TESTFLIGHT_DISTRIBUTION_MODE: ${{ inputs.testflight_distribution }}
          TESTFLIGHT_NOTIFY_AFTER_APPROVAL: 'true'
          EXPORT_COMPLIANCE_STATUS: ${{ vars.EXPORT_COMPLIANCE_STATUS }}
          IOS_FRANCE_AVAILABLE: ${{ vars.IOS_FRANCE_AVAILABLE }}
          PASSVAULT_PRODUCTION_APPROVED: ${{ inputs.production_confirmation }}
          PASSVAULT_REQUIRED_TESTING_CONFIRMED: ${{ inputs.testing_confirmation }}
        run: |
          if [[ "${{ inputs.channel }}" == "external" ]]; then
            bundle exec fastlane ios promote_external
          else
            bundle exec fastlane ios promote_production
          fi

      - name: Remove promotion metadata
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/testflight-testers.csv"
          private_runtime="$RUNNER_TEMP/passvault-promotion"
          if [[ -d "$private_runtime" ]]; then
            find "$private_runtime" -type f -exec chmod 600 {} + 2>/dev/null || true
            find "$private_runtime" -type f -exec rm -f -- {} + 2>/dev/null || true
            find "$private_runtime" -depth -type d -exec rmdir {} + 2>/dev/null || true
          fi
