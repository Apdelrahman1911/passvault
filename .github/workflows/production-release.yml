name: Production Store Release

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Readiness-approved candidate tag
        required: true
        type: string
      platform:
        description: Store to submit; choose one when retrying a partial failure
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
      authorization_run_id:
        description: Successful Request Mobile Production Release run ID
        required: true
        type: string
      authorization_sha:
        description: Exact protected-main SHA that authorized this child run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # The release branch and both production stores are one shared lifecycle.
  group: passvault-release-pipeline
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      build_number: ${{ steps.manifest.outputs.build_number }}
      source_commit: ${{ steps.manifest.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify the protected request handoff
        env:
          AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
          AUTHORIZATION_SHA: ${{ inputs.authorization_sha }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          DEPLOYMENT_APPROVER: ${{ vars.DEPLOYMENT_APPROVER }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_ACTOR" != "github-actions[bot]" ]]; then
            echo "Production Store Release must be dispatched by the protected request workflow on main." >&2
            exit 1
          fi
          if [[ ! "$AUTHORIZATION_RUN_ID" =~ ^[1-9][0-9]*$ ||
                ! "$AUTHORIZATION_SHA" =~ ^[0-9a-f]{40}$ ||
                "$AUTHORIZATION_SHA" != "$GITHUB_SHA" ]]; then
            echo "The production authorization handoff is invalid or stale." >&2
            exit 1
          fi
          if [[ ! "$DEPLOYMENT_APPROVER" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]]; then
            echo "DEPLOYMENT_APPROVER is missing or invalid." >&2
            exit 1
          fi
          authorization_json="$RUNNER_TEMP/mobile-production-authorization.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTHORIZATION_RUN_ID" \
            > "$authorization_json"
          jq -e \
            --arg approver "$DEPLOYMENT_APPROVER" \
            --arg candidate "$CANDIDATE_TAG" \
            --arg platform "$REQUEST_PLATFORM" \
            --arg sha "$AUTHORIZATION_SHA" '
              .conclusion == "success" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $sha and
              .path == ".github/workflows/request-mobile-production.yml" and
              .display_title == ("Request mobile production " + $candidate + " (" + $platform + ")") and
              .actor.login == $approver
            ' "$authorization_json" >/dev/null || {
              echo "The production request was not an approved protected-main handoff." >&2
              exit 1
            }
      - name: Validate exact release-branch candidate
        id: manifest
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]; then
            echo "The candidate tag is invalid." >&2
            exit 1
          fi
          git fetch origin release --no-tags
          git fetch origin "refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG" --force --no-tags
          source_commit="$(git rev-parse refs/remotes/origin/release)"
          tag_commit="$(git rev-list -n 1 "$CANDIDATE_TAG")"
          if [[ "$tag_commit" != "$source_commit" ]]; then
            echo "release and the requested candidate tag do not identify the same commit." >&2
            exit 1
          fi
          gh release download "$CANDIDATE_TAG" \
            --pattern readiness-manifest.json \
            --pattern '*-artifact-receipt.json' \
            --dir "$RUNNER_TEMP/candidate"
          manifest="$RUNNER_TEMP/candidate/readiness-manifest.json"
          gh attestation verify "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidate-readiness.yml" \
            --source-ref refs/heads/testing \
            --source-digest "$source_commit" \
            --deny-self-hosted-runners >/dev/null
          source_tree="$(git rev-parse "$source_commit^{tree}")"
          ruby scripts/validate-candidate-manifest.rb "$manifest" "$source_commit" "$source_tree"
          for receipt in "$RUNNER_TEMP/candidate"/*-artifact-receipt.json; do
            gh attestation verify "$receipt" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/testing-release.yml" \
              --source-ref refs/heads/testing \
              --source-digest "$source_commit" \
              --deny-self-hosted-runners >/dev/null
          done
          ruby scripts/validate-candidate-artifact-provenance.rb \
            "$manifest" "$RUNNER_TEMP/candidate" "$source_commit" "$source_tree"
          if [[ "$(jq -r .candidateTag "$manifest")" != "$CANDIDATE_TAG" ]]; then
            echo "Readiness provenance does not match the requested candidate tag." >&2
            exit 1
          fi
          candidate_source="$RUNNER_TEMP/mobile-production-candidate-source"
          git worktree add --detach "$candidate_source" "$source_commit"
          (cd "$candidate_source" && ruby scripts/validate-mobile-store-assets.rb)
          git worktree remove --force "$candidate_source"
          {
            echo "version=$(jq -r .marketingVersion "$manifest")"
            echo "build_number=$(jq -r .buildNumber "$manifest")"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"

  promote-mobile-production:
    needs: candidate
    # GitHub validates the complete reusable workflow permission graph before
    # evaluating its job conditions. Active promotion jobs still downgrade.
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/mobile-store-release.yml
    with:
      platform: ${{ inputs.platform }}
      channel: production
      operation: promote
      version: ${{ needs.candidate.outputs.version }}
      build_number: ${{ needs.candidate.outputs.build_number }}
      candidate_tag: ${{ inputs.candidate_tag }}
      candidate_commit: ${{ needs.candidate.outputs.source_commit }}
      testflight_distribution: email-list
      production_confirmation: I_APPROVE_PRODUCTION
      testing_confirmation: I_CONFIRM_REQUIRED_TESTING_COMPLETED
      pipeline_lock_held: true
    secrets: inherit

  submitted:
    needs: [ candidate, promote-mobile-production ]
    runs-on: ubuntu-latest
    steps:
      - name: Record handoff
        env:
          REQUEST_PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo '## Production submission completed'
            echo
            # Backticks are intentional Markdown.
            # shellcheck disable=SC2016
            printf 'Requested platform: `%s`.\n' "$REQUEST_PLATFORM"
            echo 'The selected store workflow received the exact tested build.'
            echo 'Desktop signing and publication remain separate and are not prerequisites for this mobile promotion.'
          } >> "$GITHUB_STEP_SUMMARY"
