name: Production Store Release

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Readiness-approved candidate tag
        required: true
        type: string
      platform:
        description: Store to submit; choose one when retrying a partial failure
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

concurrency:
  # The release branch and both production stores are one shared lifecycle.
  group: passvault-release-pipeline
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      build_number: ${{ steps.manifest.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate exact release-branch candidate
        id: manifest
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/release ]]; then
            echo "Production must run from release." >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]; then
            echo "The candidate tag is invalid." >&2
            exit 1
          fi
          gh release download "$CANDIDATE_TAG" \
            --pattern readiness-manifest.json \
            --pattern '*-artifact-receipt.json' \
            --dir "$RUNNER_TEMP/candidate"
          manifest="$RUNNER_TEMP/candidate/readiness-manifest.json"
          gh attestation verify "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidate-readiness.yml" \
            --source-ref refs/heads/testing \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners >/dev/null
          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          ruby scripts/validate-candidate-manifest.rb "$manifest" "$GITHUB_SHA" "$source_tree"
          for receipt in "$RUNNER_TEMP/candidate"/*-artifact-receipt.json; do
            gh attestation verify "$receipt" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/testing-release.yml" \
              --source-ref refs/heads/testing \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners >/dev/null
          done
          ruby scripts/validate-candidate-artifact-provenance.rb \
            "$manifest" "$RUNNER_TEMP/candidate" "$GITHUB_SHA" "$source_tree"
          ./scripts/require-production-signing-validation.sh "$CANDIDATE_TAG"
          if [[ "$(jq -r .candidateTag "$manifest")" != "$CANDIDATE_TAG" ]]; then
            echo "Readiness provenance does not match the requested candidate tag." >&2
            exit 1
          fi
          echo "version=$(jq -r .marketingVersion "$manifest")" >> "$GITHUB_OUTPUT"
          echo "build_number=$(jq -r .buildNumber "$manifest")" >> "$GITHUB_OUTPUT"
      - name: Require production store assets
        run: ./scripts/validate-mobile-store-assets.rb

  promote-mobile-production:
    needs: candidate
    # GitHub validates the complete reusable workflow permission graph before
    # evaluating its job conditions. Active promotion jobs still downgrade.
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/mobile-store-release.yml
    with:
      platform: ${{ inputs.platform }}
      channel: production
      operation: promote
      version: ${{ needs.candidate.outputs.version }}
      build_number: ${{ needs.candidate.outputs.build_number }}
      candidate_tag: ${{ inputs.candidate_tag }}
      testflight_distribution: email-list
      production_confirmation: I_APPROVE_PRODUCTION
      testing_confirmation: I_CONFIRM_REQUIRED_TESTING_COMPLETED
      pipeline_lock_held: true
    secrets: inherit

  submitted:
    needs: [ candidate, promote-mobile-production ]
    runs-on: ubuntu-latest
    steps:
      - name: Record handoff
        env:
          REQUEST_PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo '## Production submission completed'
            echo
            # Backticks are intentional Markdown.
            # shellcheck disable=SC2016
            printf 'Requested platform: `%s`.\n' "$REQUEST_PLATFORM"
            echo 'The selected store workflow received the exact tested build.'
            echo 'After both stores report the version live, run **Publish Stable Release** for the same candidate tag.'
          } >> "$GITHUB_STEP_SUMMARY"
