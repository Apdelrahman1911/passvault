name: Audit Windows real JNA 01 (non-publishing)

# Inert proposal. Actual full source pins and independent source/instance approval
# are required before root alone can publish source, then a fresh A-only request.
on:
  push:
    branches: [codex/audit-continuation-linux-20260908]
    paths:
      - docs/audit-continuation/2026-09-08-linux/requests/windows-real-jna-01.json

permissions:
  contents: read

concurrency:
  group: passvault-audit-validation-20260908
  # Not global/local exclusivity, and not protection of an older pending run.
  cancel-in-progress: false

jobs:
  real-jna-one:
    if: >-
      github.repository == 'Apdelrahman1911/passvault' &&
      github.ref == 'refs/heads/codex/audit-continuation-linux-20260908' &&
      github.event_name == 'push' && !github.event.deleted &&
      github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Read-only exact request checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Build one ordinary DLL and run only the independently admitted real-JNA case
        id: validate
        shell: pwsh
        run: python -I -B scripts/audit/windows_real_jna_01.py

      - name: Preserve compact source, one-case XML, DLL-hash and cleanup evidence only
        if: always() && steps.validate.outputs.evidence_owned == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-windows-real-jna-01-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/passvault-windows-real-jna-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/*.json
            ${{ runner.temp }}/passvault-windows-real-jna-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/*.jsonl
            ${{ runner.temp }}/passvault-windows-real-jna-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/*.log
            ${{ runner.temp }}/passvault-windows-real-jna-01-${{ github.run_id }}-${{ github.run_attempt }}-evidence/*.xml
          retention-days: 3
          compression-level: 9
          if-no-files-found: error
