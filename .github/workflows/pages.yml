name: Public website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'scripts/build-public-site.rb'
      - 'iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      PUBLISHER_NAME_AR: ${{ vars.PUBLISHER_NAME_AR }}
      COUNTRY_OR_JURISDICTION: ${{ vars.COUNTRY_OR_JURISDICTION }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      SECURITY_EMAIL: ${{ vars.SECURITY_EMAIL }}
    steps:
      - name: Require the canonical website branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Public website deployment must run from main." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build public site
        run: ruby scripts/build-public-site.rb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
