name: Play access check

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY_ONLY_NO_UPLOAD to run the disposable-edit check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: play-access-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate no-upload request
    runs-on: ubuntu-latest
    steps:
      - name: Require main and exact verification confirmation
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Play access checks must run from main." >&2
            exit 1
          fi
          if [[ "${{ inputs.confirmation }}" != "VERIFY_ONLY_NO_UPLOAD" ]]; then
            echo "The exact no-upload confirmation is required." >&2
            exit 1
          fi

  beta:
    name: Verify beta Play access
    needs: validate
    runs-on: ubuntu-latest
    environment: play-access-beta
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate beta identity through OIDC
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 600s

      - name: Check package access without upload or commit
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: ./scripts/verify-play-oidc-access.sh beta

  production:
    name: Verify production Play access
    needs: [validate, beta]
    runs-on: ubuntu-latest
    environment: play-access-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate production identity through OIDC
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 600s

      - name: Check package access without upload or commit
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: ./scripts/verify-play-oidc-access.sh production
