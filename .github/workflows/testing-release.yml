name: Testing Candidate

on:
  push:
    branches: [ testing ]
  workflow_dispatch:
    inputs:
      resume_existing_internal_uploads:
        description: Reuse attested internal receipts instead of uploading Android/iOS again
        required: true
        type: boolean
        default: false
      resume_confirmation:
        description: Required as resume:<version>:<build> when resuming existing internal uploads
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Testing, readiness, production, stable publication, and direct store retries
  # all inspect or mutate one release lifecycle and must never interleave.
  group: passvault-release-pipeline
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4096m'

jobs:
  prepare:
    # Keep the proven legacy path available during the shared-tooling pilot,
    # but never let a testing-branch sync upload the same committed build via
    # both systems. Manual dispatch remains available; automatic push uploads
    # require an explicit repository policy opt-in.
    if: github.event_name == 'workflow_dispatch' || (github.event.created == false && vars.LEGACY_TESTING_RELEASE_ON_PUSH == 'true')
    runs-on: ubuntu-latest
    env:
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      SECURITY_EMAIL: ${{ vars.SECURITY_EMAIL }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      SUPPORT_URL: ${{ vars.SUPPORT_URL }}
      PROJECT_URL: ${{ vars.PROJECT_URL }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      candidate_tag: ${{ steps.release.outputs.candidate_tag }}
      resume_existing_internal_uploads: ${{ steps.release.outputs.resume_existing_internal_uploads }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-cleanup: always

      - name: Validate candidate provenance
        id: release
        env:
          ANDROID_SIGNING_SHA256: ${{ vars.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          IOS_SIGNING_SHA1: ${{ vars.IOS_DISTRIBUTION_CERTIFICATE_SHA1 }}
          RESUME_EXISTING_INTERNAL_UPLOADS: ${{ inputs.resume_existing_internal_uploads }}
          RESUME_CONFIRMATION: ${{ inputs.resume_confirmation }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/testing ]]; then
            echo "Testing candidates must run from the testing branch." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          ./scripts/validate-testing-candidate-source.sh "$GITHUB_SHA" "$MAIN_SHA"
          VERSION="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' version.properties)"
          BUILD_NUMBER="$(awk -F= '$1 == "VERSION_CODE" { print $2 }' version.properties)"
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
             (( ${#BUILD_NUMBER} > 10 )) ||
             (( 10#$BUILD_NUMBER > 2100000000 )); then
            echo "VERSION_CODE must be the exact canonical Store build number from 1 through 2100000000." >&2
            exit 1
          fi
          ./scripts/validate-release-metadata.sh "$VERSION"
          [[ "$ANDROID_SIGNING_SHA256" =~ ^([0-9A-Fa-f]{2}:?){32}$ ]] || {
            echo "ANDROID_UPLOAD_CERTIFICATE_SHA256 is missing or invalid." >&2; exit 1;
          }
          [[ "$IOS_SIGNING_SHA1" =~ ^([0-9A-Fa-f]{2}:?){20}$ ]] || {
            echo "IOS_DISTRIBUTION_CERTIFICATE_SHA1 is missing or invalid." >&2; exit 1;
          }
          tracked_android_signing="$(tr -cd '0-9A-Fa-f' < release/android/passvault-release-cert.sha256 | tr '[:lower:]' '[:upper:]')"
          configured_android_signing="$(printf '%s' "$ANDROID_SIGNING_SHA256" | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          if [[ "$configured_android_signing" != "$tracked_android_signing" ]]; then
            echo "ANDROID_UPLOAD_CERTIFICATE_SHA256 differs from the pinned upload certificate." >&2
            exit 1
          fi
          RESUME_EXISTING=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                "$RESUME_EXISTING_INTERNAL_UPLOADS" == "true" ]]; then
            RESUME_EXISTING=true
            ruby -e 'require_relative "scripts/lib/testing_candidate_resume";
              PassVault::TestingCandidateResume.validate_confirmation!(
                ARGV.fetch(0), version: ARGV.fetch(1), build_number: ARGV.fetch(2)
              )' \
              "$RESUME_CONFIRMATION" "$VERSION" "$BUILD_NUMBER"
          elif [[ -n "$RESUME_CONFIRMATION" ]]; then
            echo "Resume confirmation is only valid with resume_existing_internal_uploads." >&2
            exit 1
          fi
          {
            printf 'version=%s\n' "$VERSION"
            printf 'build_number=%s\n' "$BUILD_NUMBER"
            printf 'candidate_tag=v%s-rc.%s\n' "$VERSION" "$BUILD_NUMBER"
            printf 'resume_existing_internal_uploads=%s\n' "$RESUME_EXISTING"
          } >> "$GITHUB_OUTPUT"

      - name: Test release automation
        run: ./scripts/test-release-automation.sh

      - name: Verify the exact candidate source
        run: ./gradlew test detekt verifyDependencies checkThirdPartyAttribution --continue --stacktrace

  mobile-internal:
    if: needs.prepare.outputs.resume_existing_internal_uploads != 'true'
    needs: prepare
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/mobile-store-release.yml
    with:
      platform: both
      channel: internal
      operation: upload
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      testflight_distribution: email-list
      pipeline_lock_held: true
    secrets: inherit

  resume-internal-receipts:
    if: needs.prepare.outputs.resume_existing_internal_uploads == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
      - name: Resume attested internal receipts for this exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_CONFIRMATION: ${{ inputs.resume_confirmation }}
          RESUME_VERSION: ${{ needs.prepare.outputs.version }}
          RESUME_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          source_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          ruby scripts/resume-testing-candidate-receipts.rb \
            --version "$RESUME_VERSION" \
            --build-number "$RESUME_BUILD_NUMBER" \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --confirmation "$RESUME_CONFIRMATION" \
            --output-dir "$RUNNER_TEMP/resumed-mobile-receipts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-receipt-android-${{ needs.prepare.outputs.build_number }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/resumed-mobile-receipts/android-artifact-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-receipt-ios-${{ needs.prepare.outputs.build_number }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/resumed-mobile-receipts/ios-artifact-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-receipt-resume-${{ needs.prepare.outputs.build_number }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/resumed-mobile-receipts/resume-receipt-sources.json

  mobile-external:
    needs: [ prepare, mobile-internal, resume-internal-receipts, desktop-linux, desktop-windows, desktop-macos ]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.desktop-linux.result == 'success' &&
      needs.desktop-windows.result == 'success' &&
      needs.desktop-macos.result == 'success' &&
      (needs.mobile-internal.result == 'success' ||
        needs.resume-internal-receipts.result == 'success') &&
      (needs.mobile-internal.result == 'skipped' ||
        needs.resume-internal-receipts.result == 'skipped')
    # A reusable workflow cannot elevate above its caller. Pass the union of
    # its statically declared job permissions; the selected promotion jobs
    # immediately downgrade to their narrower per-job permissions.
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/mobile-store-release.yml
    with:
      platform: both
      channel: external
      operation: promote
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      testflight_distribution: email-list
      pipeline_lock_held: true
    secrets: inherit

  desktop-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: >
          ./gradlew :app-desktop:createReleaseDistributable
          :app-desktop:packageReleaseDeb :app-desktop:packageReleaseRpm
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}
      - name: Smoke test unsigned Linux candidate runtime
        run: ./scripts/smoke-test-desktop-release.sh 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-desktop-linux
          if-no-files-found: error
          retention-days: 30
          path: |
            app-desktop/build/compose/binaries/main-release/deb/*.deb
            app-desktop/build/compose/binaries/main-release/rpm/*.rpm

  desktop-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build unsigned Windows candidate
        shell: pwsh
        run: >
          ./gradlew :app-desktop:createReleaseDistributable
          :app-desktop:packageReleaseMsi :app-desktop:packageReleaseExe
          "-Ppassvault.versionName=${{ needs.prepare.outputs.version }}"
      - name: Freeze the Windows candidate app image for production signing
        shell: pwsh
        run: |
          $appImage = Get-Item `
              -LiteralPath app-desktop/build/compose/binaries/main-release/app/PassVault `
              -ErrorAction Stop
          if (-not $appImage.PSIsContainer -or
              ($appImage.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "The tested Windows app image is missing or unsafe."
          }
          $archive = "PassVault-${{ needs.prepare.outputs.version }}-windows-x64-app-image.zip"
          Compress-Archive -LiteralPath $appImage.FullName -DestinationPath $archive
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              (Get-Item -LiteralPath $archive).Length -le 0) {
              throw "The tested Windows app image was not archived."
          }
          Remove-Item -LiteralPath $appImage.FullName -Recurse -Force
          ./scripts/restore-promoted-windows-app-image.ps1 `
              -ArchivePath $archive `
              -OutputRoot app-desktop/build/compose/binaries/main-release/app
      - name: Smoke test the frozen Windows candidate app image
        shell: pwsh
        run: ./scripts/smoke-test-desktop-release.ps1 -TimeoutSeconds 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-desktop-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            app-desktop/build/compose/binaries/main-release/msi/*.msi
            app-desktop/build/compose/binaries/main-release/exe/*.exe
            PassVault-${{ needs.prepare.outputs.version }}-windows-x64-app-image.zip

  desktop-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    env:
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build unsigned macOS candidate
        run: >
          ./gradlew :app-desktop:createReleaseDistributable
          :app-desktop:packageReleaseDmg
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}
      - name: Give the architecture an unambiguous asset name
        run: |
          dmg_count="$(find app-desktop/build/compose/binaries/main-release/dmg \
            -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [[ "$dmg_count" != 1 ]]; then
            echo "The candidate build must produce exactly one DMG; found $dmg_count." >&2
            exit 1
          fi
          dmg="$(find app-desktop/build/compose/binaries/main-release/dmg \
            -type f -name '*.dmg' -print)"
          cp "$dmg" "PassVault-${{ needs.prepare.outputs.version }}-macos-${{ matrix.architecture }}.dmg"
      - name: Freeze the macOS candidate app image for production signing
        run: |
          app_path="app-desktop/build/compose/binaries/main-release/app/PassVault.app"
          if [[ ! -d "$app_path" || -L "$app_path" ]]; then
            echo "The tested macOS app image is missing or unsafe." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "PassVault-${{ needs.prepare.outputs.version }}-macos-${{ matrix.architecture }}-app-image.zip"
          rm -rf -- "$app_path"
          ditto -x -k \
            "PassVault-${{ needs.prepare.outputs.version }}-macos-${{ matrix.architecture }}-app-image.zip" \
            "$(dirname "$app_path")"
          if [[ ! -d "$app_path" || -L "$app_path" ]]; then
            echo "The frozen macOS candidate app image could not be restored safely." >&2
            exit 1
          fi
      - name: Smoke test the frozen macOS candidate app image
        run: ./scripts/smoke-test-desktop-release.sh 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-desktop-macos-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 30
          path: |
            PassVault-${{ needs.prepare.outputs.version }}-macos-${{ matrix.architecture }}.dmg
            PassVault-${{ needs.prepare.outputs.version }}-macos-${{ matrix.architecture }}-app-image.zip

  publish-candidate:
    needs:
      - prepare
      - mobile-internal
      - resume-internal-receipts
      - mobile-external
      - desktop-linux
      - desktop-windows
      - desktop-macos
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.mobile-external.result == 'success' &&
      needs.desktop-linux.result == 'success' &&
      needs.desktop-windows.result == 'success' &&
      needs.desktop-macos.result == 'success' &&
      (needs.mobile-internal.result == 'success' ||
        needs.resume-internal-receipts.result == 'success') &&
      (needs.mobile-internal.result == 'skipped' ||
        needs.resume-internal-receipts.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-desktop-*
          path: downloaded-artifacts
      - name: Download exact mobile artifact receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mobile-receipt-*-${{ needs.prepare.outputs.build_number }}
          path: mobile-receipts
          merge-multiple: true
      - name: Create and validate candidate manifest
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          SOURCE_COMMIT: ${{ github.sha }}
          RESUME_EXISTING_INTERNAL_UPLOADS: ${{ needs.prepare.outputs.resume_existing_internal_uploads }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          ANDROID_SIGNING_SHA256: ${{ vars.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          IOS_SIGNING_SHA1: ${{ vars.IOS_DISTRIBUTION_CERTIFICATE_SHA1 }}
          ANDROID_INTERNAL_STATE: completed
          ANDROID_EXTERNAL_STATE: completed
          IOS_INTERNAL_STATE: completed
          IOS_EXTERNAL_STATE: submitted_for_review
          RECEIPT_SOURCE_REPOSITORY: ${{ github.repository }}
          RECEIPT_SOURCE_WORKFLOW: .github/workflows/testing-release.yml
          RECEIPT_SOURCE_RUN_ID: ${{ github.run_id }}
          RECEIPT_SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          source_commit="$SOURCE_COMMIT"
          source_tree="$(git rev-parse "$source_commit^{tree}")"
          if [[ "$RESUME_EXISTING_INTERNAL_UPLOADS" == "true" ]]; then
            resume_summary="mobile-receipts/resume-receipt-sources.json"
            [[ -f "$resume_summary" ]] || {
              echo "Resume publication requires resume-receipt-sources.json." >&2
              exit 1
            }
            source_commit="$(jq -r .sourceCommit "$resume_summary")"
            source_tree="$(jq -r .sourceTree "$resume_summary")"
            recorded_tree="$(git rev-parse "$source_commit^{tree}")"
            if [[ "$source_tree" != "$recorded_tree" ]]; then
              echo "Resume publication must keep the original candidate tree." >&2
              exit 1
            fi
            git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA" || {
              echo "Resume publication requires the original candidate commit to remain an ancestor of testing." >&2
              exit 1
            }
            export SOURCE_COMMIT="$source_commit"
          fi
          export SOURCE_TREE="$source_tree"
          desktop_build_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          if [[ "$desktop_build_tree" != "$source_tree" ]]; then
            echo "Desktop promotion inputs must come from the candidate source tree." >&2
            exit 1
          fi
          android_receipt="mobile-receipts/android-artifact-receipt.json"
          ios_receipt="mobile-receipts/ios-artifact-receipt.json"
          ruby scripts/validate-mobile-artifact-receipt.rb \
            "$android_receipt" android "$APP_VERSION" "$BUILD_NUMBER" \
            "$source_commit" "$source_tree"
          ruby scripts/validate-mobile-artifact-receipt.rb \
            "$ios_receipt" ios "$APP_VERSION" "$BUILD_NUMBER" \
            "$source_commit" "$source_tree"
          ./scripts/prepare-release-assets.sh \
            downloaded-artifacts release-assets "${{ needs.prepare.outputs.version }}" test
          for promotion_name in \
            "PassVault-$APP_VERSION-windows-x64-app-image.zip" \
            "PassVault-$APP_VERSION-macos-arm64-app-image.zip" \
            "PassVault-$APP_VERSION-macos-x64-app-image.zip"; do
            mapfile -d '' promotion_matches < <(
              find downloaded-artifacts -type f -name "$promotion_name" -print0
            )
            if (( ${#promotion_matches[@]} != 1 )); then
              echo "Expected exactly one candidate promotion input named $promotion_name." >&2
              exit 1
            fi
            install -m 0600 "${promotion_matches[0]}" "release-assets/$promotion_name"
          done
          mapfile -d '' linux_debs < <(find release-assets -maxdepth 1 -type f -name '*.deb' -print0)
          mapfile -d '' linux_rpms < <(find release-assets -maxdepth 1 -type f -name '*.rpm' -print0)
          if (( ${#linux_debs[@]} != 1 || ${#linux_rpms[@]} != 1 )); then
            echo "The Desktop candidate must contain exactly one Linux DEB and RPM." >&2
            exit 1
          fi
          RECEIPT_VERSION="$APP_VERSION" \
          RECEIPT_BUILD_NUMBER="$BUILD_NUMBER" \
          RECEIPT_SOURCE_COMMIT="$source_commit" \
          RECEIPT_SOURCE_TREE="$source_tree" \
          RECEIPT_CANDIDATE_TAG="$CANDIDATE_TAG" \
          DESKTOP_LINUX_DEB_PATH="${linux_debs[0]}" \
          DESKTOP_LINUX_RPM_PATH="${linux_rpms[0]}" \
          DESKTOP_WINDOWS_X64_APP_IMAGE_PATH="release-assets/PassVault-$APP_VERSION-windows-x64-app-image.zip" \
          DESKTOP_MACOS_ARM64_APP_IMAGE_PATH="release-assets/PassVault-$APP_VERSION-macos-arm64-app-image.zip" \
          DESKTOP_MACOS_X64_APP_IMAGE_PATH="release-assets/PassVault-$APP_VERSION-macos-x64-app-image.zip" \
            ruby scripts/create-desktop-artifact-receipt.rb \
              > release-assets/desktop-artifact-receipt.json
          ruby scripts/validate-desktop-artifact-receipt.rb \
            release-assets/desktop-artifact-receipt.json "$APP_VERSION" "$BUILD_NUMBER" \
            "$source_commit" "$source_tree" release-assets
          ANDROID_ARTIFACT_RECEIPT_SHA256="$(sha256sum "$android_receipt" | awk '{ print $1 }')"
          IOS_ARTIFACT_RECEIPT_SHA256="$(sha256sum "$ios_receipt" | awk '{ print $1 }')"
          DESKTOP_ARTIFACT_RECEIPT_SHA256="$(sha256sum release-assets/desktop-artifact-receipt.json | awk '{ print $1 }')"
          export ANDROID_ARTIFACT_RECEIPT_SHA256 IOS_ARTIFACT_RECEIPT_SHA256 \
            DESKTOP_ARTIFACT_RECEIPT_SHA256
          ruby scripts/create-candidate-manifest.rb > candidate-manifest.json
          ruby scripts/validate-candidate-manifest.rb \
            --allow-pending candidate-manifest.json "$source_commit" "$source_tree"
          cp candidate-manifest.json release-assets/
          cp "$android_receipt" "$ios_receipt" release-assets/
          ruby scripts/validate-candidate-artifact-provenance.rb \
            release-assets/candidate-manifest.json release-assets \
            "$source_commit" "$source_tree" release-assets
          checksum_manifest="$RUNNER_TEMP/candidate-SHA256SUMS.txt"
          (cd release-assets && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt \
            -print | sed 's#^./##' | LC_ALL=C sort | xargs sha256sum) \
              > "$checksum_manifest"
          install -m 0644 "$checksum_manifest" release-assets/SHA256SUMS.txt
          rm -f -- "$checksum_manifest"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
      - name: Attest the candidate manifest and desktop artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publish unsigned testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.candidate_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          target_commit="$GITHUB_SHA"
          if [[ -f mobile-receipts/resume-receipt-sources.json ]]; then
            target_commit="$(jq -r .sourceCommit mobile-receipts/resume-receipt-sources.json)"
          fi
          gh release create "$TAG" release-assets/* \
            --target "$target_commit" \
            --prerelease \
            --latest=false \
            --title "PassVault $VERSION testing candidate" \
            --notes "WARNING: Windows and macOS desktop packages in this testing prerelease are intentionally unsigned. The attested Desktop receipt freezes the tested Linux packages and Windows/macOS app images used by production signing. Mobile build ${{ needs.prepare.outputs.build_number }} was promoted from internal to external testing without rebuilding. Do not treat this as a production release."
