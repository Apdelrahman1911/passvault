name: Testing Candidate

on:
  push:
    branches: [ testing ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4096m'

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.created == false
    runs-on: ubuntu-latest
    env:
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      SECURITY_EMAIL: ${{ vars.SECURITY_EMAIL }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      SUPPORT_URL: ${{ vars.SUPPORT_URL }}
      PROJECT_URL: ${{ vars.PROJECT_URL }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      candidate_tag: ${{ steps.release.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate candidate provenance
        id: release
        env:
          ANDROID_SIGNING_SHA256: ${{ vars.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          IOS_SIGNING_SHA1: ${{ vars.IOS_DISTRIBUTION_CERTIFICATE_SHA1 }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/testing ]]; then
            echo "Testing candidates must run from the testing branch." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "The candidate must contain the current main branch." >&2
            exit 1
          fi
          VERSION="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' version.properties)"
          CURRENT_CODE="$(awk -F= '$1 == "VERSION_CODE" { print $2 }' version.properties)"
          BUILD_NUMBER=$((1000000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          if (( BUILD_NUMBER <= CURRENT_CODE )); then
            echo "Generated build number $BUILD_NUMBER must exceed $CURRENT_CODE." >&2
            exit 1
          fi
          ./scripts/validate-release-metadata.sh "$VERSION"
          [[ "$ANDROID_SIGNING_SHA256" =~ ^([0-9A-Fa-f]{2}:?){32}$ ]] || {
            echo "ANDROID_UPLOAD_CERTIFICATE_SHA256 is missing or invalid." >&2; exit 1;
          }
          [[ "$IOS_SIGNING_SHA1" =~ ^([0-9A-Fa-f]{2}:?){20}$ ]] || {
            echo "IOS_DISTRIBUTION_CERTIFICATE_SHA1 is missing or invalid." >&2; exit 1;
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=v$VERSION-rc.$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Test release automation
        run: ./scripts/test-release-automation.sh

  mobile-internal:
    needs: prepare
    uses: ./.github/workflows/mobile-store-release.yml
    with:
      platform: both
      channel: internal
      operation: upload
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      testflight_distribution: email-list
    secrets: inherit

  mobile-external:
    needs: [ prepare, mobile-internal ]
    uses: ./.github/workflows/mobile-store-release.yml
    with:
      platform: both
      channel: external
      operation: promote
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      testflight_distribution: email-list
    secrets: inherit

  desktop-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - run: >
          ./gradlew :app-desktop:packageReleaseDeb :app-desktop:packageReleaseRpm
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-desktop-linux
          if-no-files-found: error
          retention-days: 30
          path: |
            app-desktop/build/compose/binaries/main-release/deb/*.deb
            app-desktop/build/compose/binaries/main-release/rpm/*.rpm

  desktop-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build unsigned Windows candidate
        shell: pwsh
        run: >
          ./gradlew :app-desktop:packageReleaseMsi :app-desktop:packageReleaseExe
          "-Ppassvault.versionName=${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-desktop-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            app-desktop/build/compose/binaries/main-release/msi/*.msi
            app-desktop/build/compose/binaries/main-release/exe/*.exe

  desktop-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build unsigned macOS candidate
        run: >
          ./gradlew :app-desktop:packageReleaseDmg
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}
      - name: Give the architecture an unambiguous asset name
        run: |
          dmg="$(find app-desktop/build/compose/binaries/main-release/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "PassVault-${{ needs.prepare.outputs.version }}-macos-${{ matrix.architecture }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-desktop-macos-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 30
          path: PassVault-${{ needs.prepare.outputs.version }}-macos-${{ matrix.architecture }}.dmg

  publish-candidate:
    needs:
      - prepare
      - mobile-external
      - desktop-linux
      - desktop-windows
      - desktop-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-desktop-*
          path: downloaded-artifacts
      - name: Create and validate candidate manifest
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          SOURCE_COMMIT: ${{ github.sha }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
          ANDROID_SIGNING_SHA256: ${{ vars.ANDROID_UPLOAD_CERTIFICATE_SHA256 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          IOS_SIGNING_SHA1: ${{ vars.IOS_DISTRIBUTION_CERTIFICATE_SHA1 }}
          ANDROID_INTERNAL_STATE: completed
          ANDROID_EXTERNAL_STATE: completed
          IOS_INTERNAL_STATE: completed
          IOS_EXTERNAL_STATE: submitted_for_review
        run: |
          ruby scripts/create-candidate-manifest.rb > candidate-manifest.json
          ruby scripts/validate-candidate-manifest.rb \
            --allow-pending candidate-manifest.json "$GITHUB_SHA"
          ./scripts/prepare-release-assets.sh \
            downloaded-artifacts release-assets "${{ needs.prepare.outputs.version }}" test
          cp candidate-manifest.json release-assets/
          (cd release-assets && sha256sum candidate-manifest.json >> SHA256SUMS.txt)
      - name: Publish unsigned testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.candidate_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "PassVault $VERSION testing candidate" \
            --notes "WARNING: Windows and macOS desktop packages in this testing prerelease are intentionally unsigned. Mobile build ${{ needs.prepare.outputs.build_number }} was promoted from internal to external testing without rebuilding. Do not treat this as a production release."
