name: Generate Store Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4096m'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Install screenshot image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick
      - name: Build isolated screenshot APK
        run: ./gradlew :app-android:assembleStandardStoreScreenshot
      - name: Capture real app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: >-
            ./scripts/capture-android-store-screenshots.sh
            app-android/build/outputs/apk/standard/storeScreenshot/app-android-standard-storeScreenshot.apk
            generated-store-assets/android
      - uses: actions/upload-artifact@v7
        with:
          name: generated-android-store-screenshots
          path: generated-store-assets/android
          if-no-files-found: error

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Boot a 6.9-inch simulator
        run: |
          runtime="$(xcrun simctl list runtimes --json |
            ruby -rjson -e 'items=JSON.parse(STDIN.read).fetch("runtimes"); puts items.select { |r| r["isAvailable"] && r["identifier"].include?("iOS") }.last.fetch("identifier")')"
          device_type="$(xcrun simctl list devicetypes --json |
            ruby -rjson -e 'items=JSON.parse(STDIN.read).fetch("devicetypes"); item=items.find { |d| d["name"].match?(/iPhone (16|17) Pro Max/) }; puts item.fetch("identifier")')"
          device_id="$(xcrun simctl create PassVaultStoreCapture "$device_type" "$runtime")"
          echo "IOS_SCREENSHOT_DEVICE=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Build simulator app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme PassVault \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SCREENSHOT_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/PassVaultDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Capture real app screen
        run: |
          app_path="$(find "$RUNNER_TEMP/PassVaultDerivedData/Build/Products" \
            -type d -name PassVault.app -print -quit)"
          ./scripts/capture-ios-store-screenshots.sh "$app_path" generated-store-assets/ios
      - name: Stop simulator
        if: always()
        run: xcrun simctl delete "$IOS_SCREENSHOT_DEVICE" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: generated-ios-store-screenshots
          path: generated-store-assets/ios
          if-no-files-found: error

  propose:
    needs: [ android, ios ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: generated-*-store-screenshots
          path: generated
      - name: Install generated screenshots
        run: |
          cp -R generated/generated-android-store-screenshots/. release/store-assets/android/
          cp -R generated/generated-ios-store-screenshots/. release/store-assets/ios/
          ./scripts/validate-mobile-store-assets.rb
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/store-screenshots
          delete-branch: true
          commit-message: Update automated store screenshots
          title: Update automated store screenshots
          body: |
            Generated from the isolated screenshot build. Review every image for fictional data,
            localization, cropping, and store quality before merging.
