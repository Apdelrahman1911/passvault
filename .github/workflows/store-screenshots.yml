name: Generate Store Screenshots

on:
  workflow_dispatch:

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4096m'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Install screenshot image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick
      - name: Enable KVM acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Build isolated screenshot APK
        run: ./gradlew :app-android:assembleStandardStoreScreenshot
      - name: Capture real app screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: >-
            ./scripts/capture-android-store-screenshots.sh
            app-android/build/outputs/apk/standard/storeScreenshot/app-android-standard-storeScreenshot.apk
            generated-store-assets/android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-android-store-screenshots
          path: generated-store-assets/android
          if-no-files-found: error

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Install screenshot image tools
        run: brew install imagemagick
      - name: Create required iPhone and iPad simulators
        run: |
          runtime="$(xcrun simctl list runtimes --json |
            ruby -rjson -e '
              items = JSON.parse(STDIN.read).fetch("runtimes")
              ios = items.select { |item| item["isAvailable"] && item["identifier"].include?("iOS") }
              puts ios.max_by { |item| item.fetch("version").split(".").map(&:to_i) }.fetch("identifier")
            ')"
          device_types="$(xcrun simctl list devicetypes --json)"
          phone_type="$(ruby -rjson -e '
            items = JSON.parse(STDIN.read).fetch("devicetypes")
            patterns = [/iPhone 17 Pro Max/, /iPhone 16 Pro Max/]
            item = patterns.lazy.map { |pattern| items.find { |device| device["name"].match?(pattern) } }.find(&:itself)
            puts item.fetch("identifier")
          ' <<< "$device_types")"
          ipad_type="$(ruby -rjson -e '
            items = JSON.parse(STDIN.read).fetch("devicetypes")
            item = items.find { |device| device["name"].match?(/iPad Pro (13-inch|12.9-inch)/) }
            puts item.fetch("identifier")
          ' <<< "$device_types")"
          phone_id="$(xcrun simctl create PassVaultStorePhone "$phone_type" "$runtime")"
          ipad_id="$(xcrun simctl create PassVaultStoreTablet "$ipad_type" "$runtime")"
          {
            printf 'IOS_SCREENSHOT_PHONE_DEVICE=%s\n' "$phone_id"
            printf 'IOS_SCREENSHOT_TABLET_DEVICE=%s\n' "$ipad_id"
          } >> "$GITHUB_ENV"
          xcrun simctl boot "$phone_id"
          xcrun simctl bootstatus "$phone_id" -b
      - name: Build simulator app
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme PassVault \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SCREENSHOT_PHONE_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/PassVaultDerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Locate the isolated simulator app
        run: |
          app_count="$(find "$RUNNER_TEMP/PassVaultDerivedData/Build/Products" \
            -type d -name PassVault.app | wc -l | tr -d ' ')"
          if [[ "$app_count" != 1 ]]; then
            echo "The simulator build must produce exactly one PassVault.app; found $app_count." >&2
            exit 1
          fi
          app_path="$(find "$RUNNER_TEMP/PassVaultDerivedData/Build/Products" \
            -type d -name PassVault.app -print)"
          echo "IOS_SCREENSHOT_APP_PATH=$app_path" >> "$GITHUB_ENV"
      - name: Capture required iPhone screens
        run: |
          ./scripts/capture-ios-store-screenshots.sh \
            "$IOS_SCREENSHOT_APP_PATH" generated-store-assets/ios \
            "$IOS_SCREENSHOT_PHONE_DEVICE" iphone
          xcrun simctl shutdown "$IOS_SCREENSHOT_PHONE_DEVICE"
      - name: Capture required iPad screens
        run: |
          xcrun simctl boot "$IOS_SCREENSHOT_TABLET_DEVICE"
          xcrun simctl bootstatus "$IOS_SCREENSHOT_TABLET_DEVICE" -b
          ./scripts/capture-ios-store-screenshots.sh \
            "$IOS_SCREENSHOT_APP_PATH" generated-store-assets/ios \
            "$IOS_SCREENSHOT_TABLET_DEVICE" ipad
      - name: Remove screenshot simulators
        if: always()
        run: |
          for device_id in \
            "${IOS_SCREENSHOT_PHONE_DEVICE:-}" "${IOS_SCREENSHOT_TABLET_DEVICE:-}"; do
            if [[ "$device_id" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
              xcrun simctl delete "$device_id" 2>/dev/null || true
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-ios-store-screenshots
          path: generated-store-assets/ios
          if-no-files-found: error

  propose:
    needs: [ android, ios ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: generated-*-store-screenshots
          path: ${{ runner.temp }}/generated
      - name: Install generated screenshots
        run: |
          validation_root="$RUNNER_TEMP/generated-validation"
          for locale in en-US ar; do
            mkdir -p "$validation_root/android/$locale/images/phoneScreenshots"
            install -m 0644 "release/store-assets/android/$locale/images/icon.png" \
              "$validation_root/android/$locale/images/icon.png"
            install -m 0644 "release/store-assets/android/$locale/images/featureGraphic.png" \
              "$validation_root/android/$locale/images/featureGraphic.png"
            cp "$RUNNER_TEMP/generated/generated-android-store-screenshots/$locale/images/phoneScreenshots/"*.png \
              "$validation_root/android/$locale/images/phoneScreenshots/"
          done
          mkdir -p "$validation_root/ios"
          cp -R "$RUNNER_TEMP/generated/generated-ios-store-screenshots/." \
            "$validation_root/ios/"
          ruby scripts/validate-mobile-store-assets.rb "$validation_root"
          cp -R "$RUNNER_TEMP/generated/generated-android-store-screenshots/." release/store-assets/android/
          cp -R "$RUNNER_TEMP/generated/generated-ios-store-screenshots/." release/store-assets/ios/
          ruby scripts/validate-mobile-store-assets.rb
      - name: Upload validated store assets for manual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-store-assets
          path: release/store-assets
          if-no-files-found: error
          retention-days: 14
