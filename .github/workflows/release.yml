name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4096m'

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ inputs.version }}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi

          CORE_VERSION=${VERSION%%-*}
          IFS=. read -r MAJOR MINOR PATCH <<EOF
          $CORE_VERSION
          EOF
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if [ "$VERSION_CODE" -le 0 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Calculated Android version code is out of range" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Verify version outputs
        run: |
          test -n "${{ steps.version.outputs.version }}"
          test -n "${{ steps.version.outputs.version_code }}"

  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "All Android signing secrets are required for a release workflow." >&2
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/passvault-android-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build Standard Release
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :app-android:verifyReleaseSigningConfiguration
          :app-android:assembleStandardRelease
          :app-android:bundleGoogleRelease
          -Ppassvault.requireReleaseSigning=true
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}
          -Ppassvault.versionCode=${{ needs.prepare.outputs.version_code }}

      - name: Verify signed Android artifacts
        shell: pwsh
        run: ./scripts/verify-android-signatures.ps1

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app-android/build/outputs/apk/standard/release/*.apk
            app-android/build/outputs/bundle/googleRelease/*.aab

  build-desktop-linux:
    name: Build unsigned Desktop verification package (Linux)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Build Linux Packages
        run: >
          ./gradlew :app-desktop:packageReleaseDeb :app-desktop:packageReleaseRpm
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            app-desktop/build/compose/binaries/main-release/deb/*.deb
            app-desktop/build/compose/binaries/main-release/rpm/*.rpm

  build-desktop-windows:
    name: Build and sign Desktop packages (Windows)
    runs-on: windows-latest
    needs: prepare
    env:
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build Windows distributable
        run: >
          ./gradlew :app-desktop:createReleaseDistributable
          "-Ppassvault.versionName=${{ needs.prepare.outputs.version }}"
        shell: pwsh

      - name: Smoke test packaged Windows runtime
        run: >
          ./scripts/smoke-test-desktop-release.ps1
          -TimeoutSeconds 30
        shell: pwsh

      - name: Import Windows code-signing certificate
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              throw "WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD are required."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "passvault-code-signing.pfx"
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          [Array]::Clear($bytes, 0, $bytes.Length)

          $password = ConvertTo-SecureString `
              $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
          Remove-Item -LiteralPath $pfxPath -Force

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $certificate = $certificates | Where-Object {
              $_.HasPrivateKey -and
              $_.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid
          } | Select-Object -First 1

          if (-not $certificate) {
              throw "The PFX does not contain a private code-signing certificate."
          }

          if ($certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
              throw "The Windows code-signing certificate has expired."
          }

          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV

      - name: Sign Windows application launcher
        env:
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
        shell: pwsh
        run: |
          $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) {
              $env:WINDOWS_TIMESTAMP_URL
          } else {
              "http://timestamp.digicert.com"
          }
          $projectUrl = if ($env:PROJECT_URL) {
              $env:PROJECT_URL
          } else {
              "https://github.com/Apdelrahman1911/passvault"
          }
          $launcher = Get-ChildItem `
              app-desktop/build/compose/binaries/main-release/app `
              -Recurse -Filter "PassVault.exe" | Select-Object -First 1
          if (-not $launcher) {
              throw "The packaged PassVault launcher was not found."
          }
          ./scripts/sign-windows-artifacts.ps1 `
              -Path $launcher.FullName `
              -CertificateThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT `
              -TimestampUrl $timestampUrl `
              -ProductUrl $projectUrl

      - name: Build Windows installers from signed launcher
        shell: pwsh
        run: >
          ./gradlew :app-desktop:packageReleaseMsi
          :app-desktop:packageReleaseExe
          -x :app-desktop:createReleaseDistributable
          "-Ppassvault.versionName=${{ needs.prepare.outputs.version }}"

      - name: Sign and verify Windows installers
        env:
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
        shell: pwsh
        run: |
          $timestampUrl = if ($env:WINDOWS_TIMESTAMP_URL) {
              $env:WINDOWS_TIMESTAMP_URL
          } else {
              "http://timestamp.digicert.com"
          }
          $projectUrl = if ($env:PROJECT_URL) {
              $env:PROJECT_URL
          } else {
              "https://github.com/Apdelrahman1911/passvault"
          }
          $artifacts = Get-ChildItem `
              app-desktop/build/compose/binaries/main-release `
              -Recurse -File | Where-Object { $_.Extension -in ".exe", ".msi" }
          $installers = $artifacts | Where-Object {
              $_.FullName -match "[\\/](exe|msi)[\\/]"
          }
          ./scripts/sign-windows-artifacts.ps1 `
              -Path $installers.FullName `
              -CertificateThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT `
              -TimestampUrl $timestampUrl `
              -ProductUrl $projectUrl

      - name: Remove imported Windows certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              Remove-Item `
                  -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" `
                  -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            app-desktop/build/compose/binaries/main-release/msi/*.msi
            app-desktop/build/compose/binaries/main-release/exe/*.exe

  build-desktop-macos:
    name: Build, sign, and notarize Desktop package (macOS)
    runs-on: macos-latest
    needs: prepare
    env:
      MACOS_SIGN: 'true'
      MACOS_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      COPYRIGHT_HOLDER: ${{ vars.COPYRIGHT_HOLDER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Validate macOS release inputs
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ vars.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          missing=()
          [[ -z "$MACOS_IDENTITY" ]] && missing+=(MACOS_IDENTITY)
          [[ -z "$MACOS_CERTIFICATE_BASE64" ]] && missing+=(MACOS_CERTIFICATE_BASE64)
          [[ -z "$MACOS_CERTIFICATE_PASSWORD" ]] && missing+=(MACOS_CERTIFICATE_PASSWORD)
          [[ -z "$MACOS_NOTARIZATION_APPLE_ID" ]] && missing+=(MACOS_NOTARIZATION_APPLE_ID)
          [[ -z "$MACOS_NOTARIZATION_PASSWORD" ]] && missing+=(MACOS_NOTARIZATION_PASSWORD)
          [[ -z "$MACOS_NOTARIZATION_TEAM_ID" ]] && missing+=(MACOS_NOTARIZATION_TEAM_ID)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing macOS release inputs: ${missing[*]}" >&2
            exit 1
          fi
          if [[ "$MACOS_IDENTITY" != "Developer ID Application:"* ]]; then
            echo "MACOS_IDENTITY must name a Developer ID Application certificate." >&2
            exit 1
          fi
          if [[ ! "$MACOS_NOTARIZATION_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "MACOS_NOTARIZATION_TEAM_ID must be a 10-character Apple Team ID." >&2
            exit 1
          fi

      - name: Import macOS signing certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ vars.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/passvault-developer-id.p12"
          keychain_path="$RUNNER_TEMP/passvault-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          notary_profile="passvault-notary-${GITHUB_RUN_ID}"

          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" |
            openssl base64 -d -A -out "$certificate_path"
          chmod 600 "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f "$certificate_path"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "$MACOS_IDENTITY"
          security find-certificate -c "$MACOS_IDENTITY" -p "$keychain_path" |
            openssl x509 -checkend 0 -noout

          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --keychain "$keychain_path"

          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_PROFILE=$notary_profile" >> "$GITHUB_ENV"

      - name: Build macOS Package
        run: >
          ./gradlew :app-desktop:packageReleaseDmg
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}

      - name: Verify and notarize macOS package
        run: |
          dmg_path="$(find app-desktop/build/compose/binaries/main-release/dmg -name '*.dmg' -print -quit)"
          app_path="$(find app-desktop/build/compose/binaries/main-release/app -type d -name 'PassVault.app' -print -quit 2>/dev/null || true)"
          if [[ -z "$dmg_path" ]]; then
            echo "The PassVault DMG was not produced." >&2
            exit 1
          fi
          ./scripts/notarize-macos-artifact.sh \
            "$dmg_path" \
            "$app_path" \
            "app-desktop/build/reports/macos-notarization.json"

      - name: Remove temporary macOS keychain
        if: always()
        run: |
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            app-desktop/build/compose/binaries/main-release/dmg/*.dmg

      - name: Upload macOS notarization log
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-notarization-log
          path: app-desktop/build/reports/macos-notarization.json

  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [prepare]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          echo "## What's New in PassVault $VERSION" > release_notes.md
          echo "" >> release_notes.md
          
          # Get changes since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "### Changes" >> release_notes.md
            git log --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD >> release_notes.md
          else
            echo "### Initial Release" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "### Downloads" >> release_notes.md
          echo "- Android APK (Standard)" >> release_notes.md
          echo "- Android App Bundle (Google Play)" >> release_notes.md
          echo "" >> release_notes.md
          echo "Desktop packages are unsigned CI verification artifacts and are not attached to the release." >> release_notes.md
          
          cat release_notes.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
