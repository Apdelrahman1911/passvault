name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx4096m'

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ inputs.version }}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi

          CORE_VERSION=${VERSION%%-*}
          IFS=. read -r MAJOR MINOR PATCH <<EOF
          $CORE_VERSION
          EOF
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if [ "$VERSION_CODE" -le 0 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Calculated Android version code is out of range" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Verify version outputs
        run: |
          test -n "${{ steps.version.outputs.version }}"
          test -n "${{ steps.version.outputs.version_code }}"

  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Setup Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "All Android signing secrets are required for a release workflow." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Standard Release
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: >
          ./gradlew :app-android:assembleStandardRelease
          :app-android:bundleStandardRelease
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}
          -Ppassvault.versionCode=${{ needs.prepare.outputs.version_code }}

      - name: Verify signed Android artifacts
        run: |
          test -n "$(find app-android/build/outputs/apk/standard/release -name '*.apk' -print -quit)"
          test -n "$(find app-android/build/outputs/bundle/standardRelease -name '*.aab' -print -quit)"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app-android/build/outputs/apk/standard/release/*.apk
            app-android/build/outputs/bundle/standardRelease/*.aab

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-android/build/outputs/apk/standard/release/*.apk
            app-android/build/outputs/bundle/standardRelease/*.aab
          draft: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

  build-desktop-linux:
    name: Build unsigned Desktop verification package (Linux)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Build Linux Packages
        run: >
          ./gradlew :app-desktop:packageReleaseDeb :app-desktop:packageReleaseRpm
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            app-desktop/build/compose/binaries/main-release/deb/*.deb
            app-desktop/build/compose/binaries/main-release/rpm/*.rpm

  build-desktop-windows:
    name: Build unsigned Desktop verification package (Windows)
    runs-on: windows-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Build Windows Packages
        run: >
          ./gradlew :app-desktop:createReleaseDistributable
          :app-desktop:packageReleaseMsi :app-desktop:packageReleaseExe
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}
        shell: pwsh

      - name: Smoke test packaged Windows runtime
        run: >
          ./scripts/smoke-test-desktop-release.ps1
          -TimeoutSeconds 30
        shell: pwsh

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            app-desktop/build/compose/binaries/main-release/msi/*.msi
            app-desktop/build/compose/binaries/main-release/exe/*.exe

  build-desktop-macos:
    name: Build unsigned Desktop verification package (macOS)
    runs-on: macos-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Build macOS Package
        env:
          MACOS_SIGN: ${{ secrets.MACOS_SIGN }}
          MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: >
          ./gradlew :app-desktop:packageReleaseDmg
          -Ppassvault.versionName=${{ needs.prepare.outputs.version }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            app-desktop/build/compose/binaries/main-release/dmg/*.dmg

  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [prepare]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          echo "## What's New in PassVault $VERSION" > release_notes.md
          echo "" >> release_notes.md
          
          # Get changes since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "### Changes" >> release_notes.md
            git log --pretty=format:"- %s" "$PREVIOUS_TAG"..HEAD >> release_notes.md
          else
            echo "### Initial Release" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "### Downloads" >> release_notes.md
          echo "- Android APK (Standard)" >> release_notes.md
          echo "- Android App Bundle (Google Play)" >> release_notes.md
          echo "" >> release_notes.md
          echo "Desktop packages are unsigned CI verification artifacts and are not attached to the release." >> release_notes.md
          
          cat release_notes.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
