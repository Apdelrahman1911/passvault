name: Audit Windows native validation (non-publishing)

# Deliberately inert until root commits a separately reviewed one-shot request.
# Changes to source, this workflow, helpers, or ordinary reports do not run it.
on:
  push:
    branches: [codex/audit-continuation-linux-20260908]
    paths:
      - docs/audit-continuation/2026-09-08-linux/requests/windows-native.json

permissions:
  contents: read

concurrency:
  group: passvault-audit-validation-20260908
  cancel-in-progress: false

jobs:
  native:
    if: >-
      github.repository == 'Apdelrahman1911/passvault' &&
      github.ref == 'refs/heads/codex/audit-continuation-linux-20260908' &&
      github.event_name == 'push' && !github.event.deleted &&
      github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Read-only exact request checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Run the admitted native-only request
        shell: pwsh
        run: python -I -B scripts/audit/windows_native_validation.py

      - name: Preserve compact evidence, never application binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/passvault-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/passvault-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*.jsonl
            ${{ runner.temp }}/passvault-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/passvault-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*.xml
          retention-days: 3
          compression-level: 9
          if-no-files-found: error
