        }
        def selectedOutputs = [output(TARGET, 'Test.reports.junitXml.outputLocation', target.reports.junitXml.outputLocation)]
        def legal = tasks.find { it.path == LEGAL }
        String legalGetterBinding = legal == null ? 'NOT_IN_GRAPH' : 'UNBOUND_TYPE_NOT_QUERIED'
        if (legal != null) {
            // Exactly the source-defined property at app build.gradle.kts:298-325/491-503/665-671.
            // The conventional Kotlin-script/decorated names are NOT claimed observed.
            // Unknown concrete hierarchy: retain graph type, do not invoke its getter.
            String sourceType = 'Build_gradle$PrepareAndroidLegalAssets'
            if (legal.class.name == sourceType + '_Decorated' && legal.class.superclass?.name == sourceType) {
                def getter = legal.class.getMethod('getOutputDirectory')
                if (!DirectoryProperty.class.isAssignableFrom(getter.returnType)) reject('legal output getter type changed')
                selectedOutputs.add(output(LEGAL, 'PrepareAndroidLegalAssets.getOutputDirectory', getter.invoke(legal)))
                legalGetterBinding = 'SOURCE_HIERARCHY_MATCHED_LEXICAL_PATH_ONLY'
            }
        }
        emit(common() + [kind: 'graph', taskCount: tasks.size(), tasks: rows, testTasks: tests,
            targetPolicy: policy, selectedOutputs: selectedOutputs, edgeReferences: edgeRefs,
            legalGetterBinding: legalGetterBinding,
            outputPathScope: 'LEXICAL_ONLY_PHYSICAL_AND_SYNC_DELETE_BOUNDARY_UNBOUND',
            otherOutputRoles: 'UNBOUND_NOT_QUERIED', allTasksAreObservationsNotAnExecutionAllowlist: true])
        graphCount++
        if (tests != [TARGET] || !policy.enabled || policy.includePatterns != [FILTER] ||
                !policy.excludePatterns.empty || !policy.commandLineIncludePatterns.empty ||
                !policy.failOnNoMatchingTests || policy.ignoreFailures || policy.maxParallelForks != 1 || policy.forkEvery != 0 ||
                selectedOutputs[0].root != boundary.resolve('test-results/testDebugUnitTest').toString()) {
            reject('exact selected Test/filter/default XML-output policy changed')
        }
        intended = new PassVaultAndroidHostGraphOnlyRefusal()
        phase = 'intended-refusal'
    } catch (Throwable error) {
        collectionFailure = error
    } finally {
        // Unconditional gate, including every metadata/error path. Never discovery -> execution.
        if (collectionFailure != null || intended == null) {
            phase = 'graph-rejected'
            throw new GradleException('AndroidHostGraph04: metadata refused; all task actions forbidden', collectionFailure)
        }
        throw intended
    }
