import groovy.json.JsonOutput
import org.gradle.api.GradleException
import org.gradle.api.artifacts.verification.DependencyVerificationMode
import org.gradle.api.tasks.testing.Test

// NEW Detekt02 scope guard/metadata only; not execution admission. No Test
// selection, alternate analyzer, source exclusion, dependency or rule changes.
def start = gradle.startParameter
if (start.taskNames != [':detekt'] || !start.continueOnFailure || !start.excludedTaskNames.empty ||
        start.parallelProjectExecutionEnabled || start.configureOnDemand ||
        start.maxWorkerCount != 1 || start.buildCacheEnabled ||
        start.dependencyVerificationMode != DependencyVerificationMode.STRICT) {
    throw new GradleException('Detekt02 requires only root :detekt --continue, one worker, serial strict verification')
}

gradle.taskGraph.whenReady { graph ->
    def root = gradle.rootProject
    def coverage = root.tasks.named('verifyStaticAnalysisCoverage').get()
    def detektTasks = root.allprojects.collect { it.tasks.named('detekt').get() }
    if (graph.allTasks.toSet() != (detektTasks + coverage).toSet() ||
            graph.allTasks.any { it instanceof Test } || !coverage.enabled ||
            coverage.commandLine != ['ruby', 'scripts/verify-static-analysis-coverage.rb'] ||
            coverage.workingDir.canonicalFile != root.projectDir.canonicalFile) {
        throw new GradleException('Detekt02 forbids graph expansion, tests, or an altered inventory guard')
    }

    def sourceRoot = root.projectDir.canonicalFile.toPath()
    def relative = { File file ->
        def path = file.canonicalFile.toPath()
        if (!path.startsWith(sourceRoot)) {
            throw new GradleException('Detekt02 input/report escaped the disposable source snapshot')
        }
        sourceRoot.relativize(path).toString().replace(File.separator, '/')
    }
    detektTasks.sort { it.path }.each { task ->
        if (!task.enabled || task.project.extensions.getByName('detekt').parallel.get() ||
                task.jvmTarget.get() != '17') {
            throw new GradleException('Detekt02 requires enabled serial generic Detekt with JVM target 17')
        }
        def reports = [:]
        ['checkstyle', 'html', 'sarif'].each { kind ->
            def report = task.reports."${kind}"
            if (!report.required.get()) {
                throw new GradleException('Detekt02 requires the existing compact static-report formats')
            }
            reports[kind] = relative(report.outputLocation.get().asFile)
        }
        // Planned task inputs are not per-file engine visitation or test cases.
        println('PASSVAULT_DETEKT02_TASK=' + JsonOutput.toJson([
            task: task.path,
            sources: task.source.files.collect { relative(it) }.sort(),
            reports: reports,
        ]))
    }
}
